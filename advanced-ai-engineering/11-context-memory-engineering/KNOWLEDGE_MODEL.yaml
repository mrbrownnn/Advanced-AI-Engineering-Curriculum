  - { concept: "memory_stage_attribution", depends_on: ["write_policy", "read_policy", "effective_context"] }

mechanisms:
  - id: "MECH-01"
    description: "A context contract reserves model-specific tokens for instructions, tool definitions/results, history, retrieved evidence, structured state, current input, framing, and output. Token counting is taught here at first use: counts come from the target tokenizer on the serialized request or from server usage; heuristics carry a measured margin. Overflow is resolved by priority caps over whole atomic groups, never by reducing the output reserve."
    evidence_ids: ["CLM-001", "CLM-002", "CLM-016", "CLM-017"]
    derived_from: []
  - id: "MECH-02"
    description: "Effective context is measured across length, evidence position, distractors, multiplicity, aggregation, and task complexity rather than inferred from the advertised maximum."
    evidence_ids: ["CLM-003", "CLM-004"]
    derived_from: ["MECH-01"]
  - id: "MECH-03"
    description: "A memory architecture separates immutable events, working context, canonical structured state, derived summaries, retrieved semantic/episodic records, and procedural artifacts."
    evidence_ids: ["CLM-005", "CLM-006", "CLM-007"]
    derived_from: ["MECH-01"]
  - id: "MECH-04"
    description: "Memory writes use eligibility, identity, provenance, confidence, consent, valid time, TTL, update, delete, and review policy instead of append-only retention. Canonical-state writes are conditional on operation ID and base version; deletes are versioned tombstones collected only after convergence and the redelivery window."
    evidence_ids: ["CLM-008", "CLM-013", "CLM-018"]
    derived_from: ["MECH-03"]
  - id: "MECH-05"
    description: "Memory reads apply hard authorization/validity filters and workload-tested ranking before assembling selected records into context with lineage."
    evidence_ids: ["CLM-009", "CLM-013", "CLM-014"]
    derived_from: ["MECH-03", "MECH-04"]
  - id: "MECH-06"
    description: "Compaction chooses among deterministic truncation, state extraction, summarization, retrieval, and learned compression while preserving recoverable provenance and measuring semantic loss plus preprocessing overhead."
    evidence_ids: ["CLM-010", "CLM-011", "CLM-016"]
    derived_from: ["MECH-01", "MECH-02", "MECH-03"]
  - id: "MECH-07"
    description: "Memory evaluation separately tests ingestion/write, persistence/update/delete, selection/retrieval, context placement, utilization, task outcome, forgetting, latency, cost, and privacy."
    evidence_ids: ["CLM-012", "CLM-013", "CLM-014", "CLM-015"]
    derived_from: ["MECH-04", "MECH-05", "MECH-06"]

mathematical_models:
  - id: "MATH-01"
    description: "For a declared tokenizer/protocol: T_system+T_tools+T_history+T_evidence+T_state+T_input+T_framing+T_output_reserve <= T_limit. Exact admission uses target-interface counts; approximate admission includes calibrated error margin. Ledger reconciliation: placed input + reserve + margin + unallocated = limit (fixture: 28,980 + 2,000 + 600 + 420 = 32,000)."
    evidence_ids: ["CLM-001", "CLM-002", "CLM-016", "CLM-017"]
    derived_from: ["MECH-01"]
  - id: "MATH-02"
    description: "Compression ratio = retained serialized tokens / original serialized tokens. Net latency delta includes compression/extraction time plus changed model queue/prefill/decode time; ratio alone predicts neither quality nor speed."
    evidence_ids: ["CLM-010", "CLM-011"]
    derived_from: ["MECH-06"]
  - id: "MATH-03"
    description: "A retention/read utility score may combine measured relevance, recency, importance, authority, confidence, reuse value, token cost, privacy risk, and staleness subject to hard constraints; weights are an engineering heuristic, not cognitive truth."
    evidence_ids: ["CLM-008", "CLM-009", "CLM-013"]
    derived_from: ["MECH-04", "MECH-05"]
  - id: "MATH-04"
    description: "Stage metrics condition on opportunity: stored, valid given stored, selected given valid, placed given selected, used given placed, on one cohort with nested counts. The product of these rates equals used/probes exactly (fixture: 94/200 = 0.47) and differs from end-to-end success when successes bypass the chain (0.50). Rates with other denominators, such as selection precision, cannot be multiplied into the chain."
    evidence_ids: ["CLM-012", "CLM-014", "CLM-015", "CLM-019", "CLM-020"]
    derived_from: ["MECH-07"]

implementation_mechanisms:
  - id: "IMPL-01"
    description: "A context ledger records actual serialized token counts or estimator/version/error, allocation by category with priority and cap, requested versus placed tokens, dropped group IDs, margin, unallocated tokens, retained IDs/order, and output reserve."
    evidence_ids: ["CLM-001", "CLM-002", "CLM-017"]
    derived_from: ["MECH-01"]
  - id: "IMPL-02"
    description: "A memory record carries immutable ID, type, owner/scope, key, version, source event, valid and transaction time, content/hash, confidence, privacy class, TTL, supersession/tombstone, and derived-from lineage; canonical state has one live version per key and summaries are valid only relative to the events they were derived from."
    evidence_ids: ["CLM-005", "CLM-008", "CLM-009", "CLM-010", "CLM-018"]
    derived_from: ["MECH-03", "MECH-04", "MECH-05"]
  - id: "IMPL-03"
    description: "Pinned LangChain trace (re-read 2026-09-30, static) covers trim_messages with caller-configured boundary controls, count_tokens_approximately with defaults of 4.0 characters per token and 3.0 extra tokens per message, and process-local InMemoryChatMessageHistory operations, with approximation and durability limits explicit."
    evidence_ids: ["CLM-016"]
    derived_from: ["MECH-01", "MECH-06"]

failure_modes:
  - id: "FAIL-01"
    description: "Budget overflow or silent truncation removes instructions, splits tool call/result pairs, drops evidence, or consumes the output reserve because visible text alone was counted or messages were dropped individually."
    evidence_ids: ["CLM-001", "CLM-002", "CLM-016", "CLM-017"]
    derived_from: ["MECH-01", "MATH-01"]
  - id: "FAIL-02"
    description: "Advertised-window fallacy passes a simple needle test but fails under position changes, distractors, multiple facts, aggregation, or long-range reasoning."
    evidence_ids: ["CLM-003", "CLM-004"]
    derived_from: ["MECH-02"]
  - id: "FAIL-03"
    description: "Memory pollution stores incorrect, low-value, private, adversarial, or transient content and later replays it as trusted state."
    evidence_ids: ["CLM-008", "CLM-013"]
    derived_from: ["MECH-04"]
  - id: "FAIL-04"
    description: "Stale or fragmented recall retrieves a topically similar record that is superseded, incomplete, unauthorized, or mismatched to the current task."
    evidence_ids: ["CLM-009", "CLM-014"]
    derived_from: ["MECH-05"]
  - id: "FAIL-05"
    description: "Recursive summary drift turns derived interpretations into apparent facts, loses negation/time/source boundaries, and becomes hard to correct without raw provenance."
    evidence_ids: ["CLM-010"]
    derived_from: ["MECH-06"]
  - id: "FAIL-06"
    description: "Compression regression reduces token count while preprocessing dominates latency or removes task-critical details and protocol structure."
    evidence_ids: ["CLM-010", "CLM-011"]
    derived_from: ["MECH-06", "MATH-02"]
  - id: "FAIL-07"
    description: "Memory benchmark blindness reports final QA or retrieval relevance while hiding write omissions, stale state, model non-use, privacy failures, or selective-forgetting errors."
    evidence_ids: ["CLM-012", "CLM-014", "CLM-015"]
    derived_from: ["MECH-07", "MATH-04"]

  - id: "FAIL-08"
    description: "Lost update or resurrection: an unconditional write lets a second correction overwrite the first, or a delayed write or summarizer job restores a deleted record; collecting a tombstone before convergence reopens the same path."
    evidence_ids: ["CLM-018"]
    derived_from: ["MECH-04", "IMPL-02"]

production_connections:
  - id: "PROD-01"
    description: "Ship context policies with hard admission, category budgets, model/protocol pins, output reserve, valid-message checks, fallback, and length-position-complexity canaries."
    evidence_ids: ["CLM-001", "CLM-002", "CLM-003", "CLM-004", "CLM-016"]
    derived_from: ["MECH-01", "MECH-02", "IMPL-01"]
  - id: "PROD-02"
    description: "Ship memory changes with shadow writes/reads, version/delete/privacy invariants, poisoned/stale/contradictory records, stage metrics, canary, and rollback."
    evidence_ids: ["CLM-008", "CLM-009", "CLM-013", "CLM-014", "CLM-015"]
    derived_from: ["MECH-04", "MECH-05", "MECH-07", "IMPL-02"]

research_connections:
  - id: "RESEARCH-01"
    description: "Three opened sources (MemoryAgentBench arXiv v4 2026, Xiong et al. arXiv v2 2025, IFCMemoryBench arXiv v1 2026; abstracts re-read 2026-09-30) extend evaluation beyond static long-context recall toward incremental interaction, selective forgetting, experience reuse, and one professional domain; none establishes a universal architecture."
    evidence_ids: ["CLM-012", "CLM-013", "CLM-014"]
    derived_from: ["MECH-07"]
  - id: "RESEARCH-02"
    description: "One 2026 prompt-compression study (abstract re-read 2026-09-30) reports end-to-end gains only in matched operating regions rather than treating token reduction as automatic latency reduction."
    evidence_ids: ["CLM-011"]
    derived_from: ["MECH-06"]

