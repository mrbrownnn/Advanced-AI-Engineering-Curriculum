    description: "Validate the meaning of regenerate, edit, dwell, and abandonment, the streaming perceived-latency effect, interference in LLM experiments, position bias in multi-draft UIs, quality-dependent nonresponse, and transfer of web latency results; each is a hypothesis with a stated test."
    evidence_ids: ["CLM-050", "CLM-051", "CLM-052", "CLM-053", "CLM-054", "CLM-055", "CLM-056", "CLM-057"]
    derived_from: []

  - id: "TODO-02"
    description: "Mastery fixture values are synthetic and must not be read as measurements."
    evidence_ids: ["CLM-058"]
    derived_from: []

candidate_capabilities:
  - capability: "Define what each feedback signal measures, join it to an exposure denominator, and state its validity status."
    mapped_mechanisms: ["MECH-01", "MECH-02", "IMPL-03", "PROD-02"]
  - capability: "Quantify and correct nonresponse and position bias with propensity weighting, and design the randomized elicitation that makes correction possible."
    mapped_mechanisms: ["MECH-03", "MATH-01", "MATH-02", "FAIL-02"]
  - capability: "Explain how approval rewards produce sycophancy and design guardrails that block approval-optimized regressions."
    mapped_mechanisms: ["MECH-04", "FAIL-01", "RES-01"]
  - capability: "Route feedback into adjudicated evaluation sets with label provenance."
    mapped_mechanisms: ["MECH-05"]
  - capability: "Turn binary and edit feedback into training data with KTO weighting and provenance filtering against poisoning."
    mapped_mechanisms: ["MECH-06", "MATH-03", "FAIL-03"]
  - capability: "Run and audit an LLM feature A/B test: SRM, CUPED with fallback detection, novelty/primacy, and guardrails."
    mapped_mechanisms: ["MECH-07", "MATH-04", "MATH-05", "IMPL-01", "IMPL-02", "FAIL-04", "PROD-01"]
  - capability: "Set latency and trust UX targets and measure overreliance rather than satisfaction alone."
    mapped_mechanisms: ["MECH-08", "FAIL-05", "TODO-01"]
  - capability: "Work conditionally from a synthetic product fixture."
    mapped_mechanisms: ["TODO-02"]
