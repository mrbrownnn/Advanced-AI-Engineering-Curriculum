  - id: CLM-002
    claim: "Under uniform uncompressed decoder attention, logical retained KV payload per token is 2 × layers × KV heads × head dimension × bytes per element; lowering KV-head count lowers this payload but does not remove query/output projection work or attention over retained positions."
    provenance: DERIVED
    domain: attention_accounting
    concepts: [kv_payload, gqa, resource_vector]
    confidence: high
    currentness_status: "REFERENCE / BASELINE"
    assumptions: ["Uniform decoder self-attention; separate K and V; identical storage dtype; no padding, metadata, sharding, sharing, quantization scales, or hybrid layers."]
    derivation: "Each layer retains one K and one V vector of H_kv × d_h elements per token. Multiply by L layers and b bytes/element. Q and O widths are functions of query heads and hidden size and therefore do not shrink by the same ratio."
    limitations: ["Logical payload is not allocator occupancy.", "Formula does not apply to MLA retained state."]
    applicability: "Analytical attention-state comparison before runtime measurement."
    related_claims: [CLM-001, CLM-003, CLM-009]
