  - id: CLM-012
    claim: "For a fixed implementation and resource demand vector, an architectural change moves a bottleneck only if a different normalized constraint becomes maximal after remeasurement; reducing one demand component can leave the same limiter, expose another limiter, or change no SLO-constrained goodput."
    provenance: DERIVED
    domain: bottleneck_transition
    concepts: [normalized_pressure, bottleneck_shift, goodput]
    confidence: high
    currentness_status: "REFERENCE / BASELINE"
    assumptions: ["Candidate configurations use the same metric boundaries and workload contract.", "Capacity and demand terms are measured or explicitly modeled with uncertainty."]
    derivation: "Define p_r=D_r/C_r for memory, compute, communication, scheduler, and host resources. The screen's active constraint is argmax p_r. Recompute all p_r after the architecture change; a shift occurs only when the ordering changes. Goodput still depends on latency and quality gates, so pressure reduction alone is insufficient."
    limitations: ["Resources can interact and multiple pressures can be near one.", "Normalized pressure is a screen, not a causal proof."]
    applicability: "Cross-layer bottleneck-stay/move analysis."
    related_claims: [CLM-008, CLM-014]
    curriculum_usage: { lessons: ["24.1", "24.3", "24.6"], labs: ["LAB-C"], assessments: ["Mastery-24", "Incident-24.1"] }

  - id: CLM-013
    claim: "A valid architecture comparison uses one versioned experiment contract for workload, model-quality evaluation, SLOs, cost boundary, failure treatment, and uncertainty; changing the traffic distribution or quality suite between candidates destroys attribution."
    provenance: DERIVED
    domain: matched_comparison
    concepts: [matched_workload, quality_gate, experiment_contract]
    confidence: high
    currentness_status: "CURRENT DEFAULT"
    assumptions: ["Architecture candidates target the same product behavior.", "Any unavoidable model-specific preprocessing difference is recorded rather than hidden."]
    derivation: "Architecture can change generated behavior and system service. If candidates see different request populations or evaluation instruments, observed deltas combine treatment effects with population/instrument drift. One contract makes quality a hard gate and permits conditional comparison of performance and cost only among passing candidates."
    limitations: ["Some architecture changes require retraining and cannot be paired at token-level outputs; pair prompts and evaluation units instead."]
    applicability: "Every lab and release decision in this module."
    related_claims: [CLM-001, CLM-003, CLM-015, CLM-016]
    curriculum_usage: { lessons: ["24.5", "24.6"], labs: ["LAB-A", "LAB-B", "LAB-C", "LAB-D"], assessments: ["Mastery-24"] }

