  - id: "CLM-012"
    claim: "A tensor-shape or parameter-count model can predict logical dimensions, but exact peak memory and OOM boundaries require empirical measurement because allocators, workspaces, backend selection, padding, cache state, graph capture, and concurrent activity contribute additional state."
    provenance: "HYPOTHESIS"
    domain: "diagnostic_methodology"
    concepts: ["oom", "peak_memory", "logical_memory", "allocator_state"]
    confidence: "high"
    hypothesis:
      prediction: "Logical tensor accounting will form a lower-bound or component estimate, while measured reserved/allocated peaks and the OOM boundary will shift when backend, allocator history, workspace, or concurrency changes without changing model dimensions."
      measurement_target: "Record per-operation tensor shapes, allocator allocated/reserved peaks, backend and workspace choices, cache state, and the first failing configuration across fresh-process repetitions."
      falsifying_observation: "Across controlled backend, workspace, allocator-history, and concurrency changes, the measured peak and OOM boundary equal the logical estimate within measurement resolution."
    limitations:
      - "The hypothesis does not imply that analytical accounting is useless; it identifies the additional evidence required for an exact deployment limit."
    applicability: "OOM prediction, model loading, and activation-memory diagnosis."
    curriculum_usage:
      lessons: ["1.6", "1.8"]
      labs: ["LAB-C"]
      assessments: ["Incident-01.1", "Mastery-01"]

