  - id: "CLM-014"
    claim: "For finite logits z and temperature T>0, softmax(z/T) preserves the ordering of token probabilities, so greedy argmax is unchanged by T; T<1 concentrates and T>1 spreads probability mass; and applying T changes the next-token distribution without changing the cost of the forward pass that produced z."
    provenance: "DERIVED"
    domain: "decoding"
    concepts: ["softmax_temperature", "greedy_decoding", "forward_cost"]
    confidence: "high"
    assumptions:
      - "Logits are finite real numbers computed before any temperature or truncation processor."
      - "T is a strictly positive scalar applied identically to all vocabulary entries."
      - "Forward-pass cost is measured for one fixed input sequence; the number of generated tokens may differ across sampling settings."
    derivation: "exp(z/T) is strictly increasing in z for T>0, so the ordering and argmax are preserved. Dividing logit gaps by T<1 enlarges them and by T>1 shrinks them, concentrating or spreading mass. Temperature is applied to the output vector after the forward pass, adding O(V) elementwise work and no change to projection or attention work. Example: z=[2,1,0,-1] gives p=[0.6439,0.2369,0.0871,0.0321] at T=1 and [0.8650,0.1171,0.0158,0.0021] at T=0.5."
    limitations:
      - "T=0 is not defined by this formula; greedy decoding is a separate branch."
      - "Different sampled tokens can change sequence length and therefore total generation cost."
    applicability: "Separating distribution effects from compute effects in sampling-based policies."
    related_claims: ["CLM-013", "CLM-007"]
    curriculum_usage:
      lessons: ["1.2"]
      labs: ["LAB-A"]
      assessments: ["Mastery-01"]

