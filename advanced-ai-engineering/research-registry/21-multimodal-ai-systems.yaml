  - id: CLM-011
    claim: "For dense padding of one sequence dimension, useful-position efficiency is the sum of true lengths divided by batch size times maximum length; this counts positions, not measured FLOPs, memory traffic, or wall time."
    provenance: DERIVED
    domain: batching
    concepts: [padding_efficiency, heterogeneous_batch]
    confidence: high
    currentness_status: "CURRENT DEFAULT (analytical diagnostic)"
    assumptions: ["Every item is padded to the largest length in its batch.", "The ratio counts positions equally."]
    derivation: "A dense B-by-L_max tensor contains B*L_max positions; sum_i L_i positions carry item data, so their ratio is the useful-position fraction."
    limitations: ["Masking, packed layouts, kernels, tile padding, and shape-dependent efficiency make measured cost differ."]
    applicability: "Encoder or decoder batching with dense sequence padding."
    curriculum_usage: { lessons: ["21.3"], labs: ["LAB-B"], assessments: ["Mastery-21", "Incident-21.1"] }

  - id: CLM-012
    claim: "A multimodal OOM or TTFT regression cannot be diagnosed from image size or memory occupancy alone; encoder work, dense padding, configured capacity, engine allocation, framework fragmentation, and host preprocessing make competing predictions that require separate measurements."
    provenance: HYPOTHESIS
    domain: diagnosis
    concepts: [competing_hypotheses, encoder_work, padding, capacity, fragmentation, host_preprocessing]
    confidence: high
    currentness_status: "WORKLOAD-DEPENDENT"
    hypothesis:
      prediction: "Each mechanism produces a distinct change under one controlled intervention: encoder work follows processed patches/encoder spans; padding follows padded-minus-valid positions; capacity follows allocation refusals/free engine blocks; allocator fragmentation follows inactive split segments or snapshots; host work follows CPU spans and GPU idle gaps."
      measurement_target: "Aligned host, processor, encoder, projector, decoder, engine-allocation, framework-allocator, and device-memory timelines under one-variable sweeps."
      falsifying_observation: "The predicted signal and intervention response do not covary while another hypothesis's predictions do."
    limitations: ["Mechanisms can interact; discrimination need not produce exactly one cause."]
    applicability: "Multimodal latency and OOM incidents."
    curriculum_usage: { lessons: ["21.5"], labs: ["LAB-D"], assessments: ["Incident-21.1", "Mastery-21"] }

