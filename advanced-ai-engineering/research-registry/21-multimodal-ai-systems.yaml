claims:
  - id: CLM-001
    claim: "Multimodal time-to-first-output must be measured as a stage ledger with explicit boundaries; when stages serialize their elapsed times add, while overlap requires a critical-path timeline rather than a sum."
    provenance: DERIVED
    domain: latency_accounting
    concepts: [stage_ledger, critical_path, ttft]
    confidence: high
    currentness_status: "CURRENT DEFAULT (recommended measurement contract, not an industry adoption claim)"
    assumptions: ["Every stage has timestamps on a common clock or a verified clock mapping.", "The output boundary is declared."]
    derivation: "Elapsed time is conserved across a serialized path. Concurrent intervals contribute their union on the critical path, so adding their individual durations double-counts overlap."
    limitations: ["Does not identify the slow stage without instrumentation.", "Client-visible latency also includes transport and buffering outside an engine trace."]
    applicability: "Image, audio, video, and mixed-stream inference pipelines."
    curriculum_usage: { lessons: ["21.1", "21.5"], labs: ["LAB-A", "LAB-D"], assessments: ["Mastery-21", "Incident-21.1"] }

