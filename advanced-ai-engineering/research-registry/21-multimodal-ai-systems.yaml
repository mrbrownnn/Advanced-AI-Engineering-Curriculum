    domain: memory_accounting
    concepts: [decoder_tokens, encoder_tokens, self_attention_kv, cross_attention_memory]
    confidence: high
    currentness_status: "CURRENT DEFAULT (architecture-scoped accounting rule)"
    assumptions: ["Decoder-only fusion replaces placeholders with modality embeddings processed by the decoder.", "The Module 03 logical KV formula applies to decoder positions retained by self-attention."]
    derivation: "Processor and bridge determine decoder-visible length. Only then can decoder KV bytes be computed as visible positions times architecture-specific bytes per position. Cross-attention architectures retain modality memory under a different tensor geometry and cannot use that substitution blindly."
    limitations: ["Physical allocation adds block rounding, metadata, fragmentation, sharing, sharding, and precision-specific scales."]
