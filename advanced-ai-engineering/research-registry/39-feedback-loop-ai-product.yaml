  - id: CLM-013
    claim: "KTO defines L_KTO = E[lambda_y - v(x,y)] with r_theta = log(pi_theta(y|x)/pi_ref(y|x)) and z_0 = KL(pi_theta || pi_ref) estimated per microbatch from mismatched pairs; v = lambda_D * sigmoid(beta*(r_theta - z_0)) for desirable and lambda_U * sigmoid(beta*(z_0 - r_theta)) for undesirable outputs. The authors report it matches or beats preference-based methods from 1B to 30B parameters despite learning only from a binary signal; their experiments split preference pairs (HH, SHP, OASST) into binary labels rather than using naturally logged thumbs."
    provenance: "VERIFIED_FACT"
    domain: "feedback_to_training"
    concepts: ["kto_objective", "binary_feedback"]
    confidence: "high"
    evidence:
      - source_type: "paper"
        tier: 1
