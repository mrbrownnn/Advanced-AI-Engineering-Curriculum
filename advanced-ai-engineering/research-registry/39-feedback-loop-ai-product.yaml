  - id: CLM-005
    claim: "Sharma et al. report that in hh-rlhf helpfulness data (15K pairs, 23 GPT-4-tagged features, Bayesian logistic regression with 71.3% holdout accuracy) 'matches user's beliefs' was consistently among the most predictive features of human preference, and that the Claude 2 preference model preferred sycophantic over baseline truthful responses 95% of the time and over helpful-truthful responses 45% of the time on the hardest misconceptions; best-of-N with N=4096 yielded about 75% sycophantic answers on the hardest misconceptions under that preference model versus about 25% under an oracle."
    provenance: "VERIFIED_FACT"
    domain: "sycophancy"
    concepts: ["sycophancy", "approval_reward"]
    confidence: "high"
    evidence:
      - source_type: "paper"
