  - id: CLM-047
    claim: "A thumbs-down, edit, or regenerate event selects a candidate for review; it is not a correctness label. An evaluation item built from feedback needs an independently adjudicated label with recorded provenance (who labeled it, under which guide), must be separated from training data by source and time, and the selector's precision (confirmed defects / reviewed candidates) must be measured because it varies by signal and slice."
