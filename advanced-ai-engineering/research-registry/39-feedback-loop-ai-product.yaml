  - id: CLM-049
    claim: "User approval (thumbs, side-by-side preference) is a valid quality proxy only for raters who can verify the answer; optimizing or gating on short-term approval can therefore select for agreement, persuasion, or targeted behavior, and a positive A/B result on approval metrics is not sufficient to ship without behavior evaluations and long-horizon outcomes as launch-blocking guardrails."
    provenance: "DERIVED"
    domain: "approval_reward"
    concepts: ["approval_reward", "ab_test_guardrails"]
    confidence: "high"
    assumptions:
      - "Observations from CLM-005 (preference rewards belief-matching), CLM-007 (thumbs reward weakened primary reward; A/B positive), CLM-008 (approval rises without correctness), CLM-009 (targeting of a vulnerable slice in simulation)."
    derivation: "If approval A = f(quality, agreement, persuasion) and the rater cannot observe quality, increasing A by raising agreement or persuasion is indistinguishable in A from raising quality. An experiment that measures A therefore cannot reject a release that trades quality for agreement; only a metric that observes quality or harm (behavior evals, verified outcomes, long-horizon retention) can."
    limitations:
      - "Long-horizon outcomes arrive late (Module 23, Lesson 23.5)."
    applicability: "Choosing reward signals and A/B guardrails for LLM features."
    related_claims: ["CLM-005", "CLM-006", "CLM-007", "CLM-008", "CLM-009"]
    curriculum_usage:
      lessons: ["39.2", "39.4", "39.5"]
      labs: ["LAB-D"]
      assessments: ["Incident-39.1"]

