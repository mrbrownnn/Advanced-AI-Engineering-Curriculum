  - id: CLM-040
    claim: "If a fraction s of exposed responses is satisfactory and users click thumbs-up with probability r_u when satisfied and thumbs-down with probability r_d when not, the observed thumbs-up share among feedback events is s*r_u/(s*r_u + (1-s)*r_d). With s=0.8, r_u=0.02, r_d=0.10 it is 0.444; raising r_u to 0.04 (for example a more prominent button) moves it to 0.615 with no quality change."
    provenance: "DERIVED"
    domain: "feedback_bias"
    concepts: ["nonresponse_bias", "response_propensity"]
    confidence: "high"
    assumptions:
      - "Each exposed response is either satisfactory or not; at most one thumb per response."
      - "Response propensities depend only on satisfaction (no other selection)."
      - "All input values are synthetic exercise values."
    derivation: "Expected up events = N*s*r_u, down events = N*(1-s)*r_d; share = ratio. 0.8*0.02 = 0.016; 0.2*0.10 = 0.02; 0.016/0.036 = 0.4444. With r_u = 0.04: 0.032/0.052 = 0.6154. Recomputed in Python 2026-11-10."
    limitations:
      - "Real propensities vary by user, task, and UI and may depend on unobserved quality (CLM-056)."
    applicability: "Interpreting thumbs share and thumbs-based A/B metrics."
    related_claims: ["CLM-041", "CLM-056"]
    curriculum_usage:
      lessons: ["39.2"]
      labs: ["LAB-A"]

  - id: CLM-041
    claim: "Weighting each feedback label by the inverse of its response propensity recovers the satisfied share (in the CLM-040 example, 160/0.02 = 8,000 and 200/0.10 = 2,000 give 0.8 of 10,000 responses), but only when propensities are known or estimated without bias, for example from a randomized prompt-for-feedback sample, and are positive; by analogy with IPS ranking estimators, small propensities inflate variance and are clipped or smoothed at the cost of bias."
    provenance: "DERIVED"
    domain: "feedback_bias"
    concepts: ["inverse_propensity_weighting", "nonresponse_bias"]
    confidence: "high"
    assumptions:
      - "Propensities are positive and depend only on observables used in the weighting (unconfoundedness, CLM-003)."
      - "Synthetic counts from CLM-040 with N = 10,000 responses."
    derivation: "IPW estimate of satisfied responses = up/r_u = 160/0.02 = 8,000; unsatisfied = down/r_d = 200/0.10 = 2,000; share = 8,000/10,000 = 0.8. The estimator is unbiased because E[up] = N*s*r_u. Clipping caps 1/r and trades variance for bias (a design choice; the IPS paper discusses smoothing)."
    limitations:
      - "Requires a randomized elicitation arm to estimate r; unconfoundedness is untested (CLM-056)."
    applicability: "Correcting nonresponse and position bias in feedback metrics."
    related_claims: ["CLM-003", "CLM-040", "CLM-056"]
    curriculum_usage:
      lessons: ["39.2"]
      labs: ["LAB-A", "LAB-B"]

  - id: CLM-042
    claim: "Because a feedback score row exists only when a user acts (CLM-033) and ingestion is asynchronous (CLM-034), feedback rates need a denominator joined from the trace or exposure log: per-feedback-event shares, per-exposed-response rates, and per-user rates are different estimands, and computing any rate from score rows alone conditions on responding."
