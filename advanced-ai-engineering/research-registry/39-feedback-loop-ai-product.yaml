    derivation: "lambda_D*n_D/(lambda_U*n_U) in [1, 1.5] with n_D/n_U = 1/4 gives lambda_D in [4, 6]. sigmoid(0.1*(2.0-0.5)) = sigmoid(0.15) = 0.5374; loss = 5 - 5*0.5374 = 2.313. Undesirable: sigmoid(0.1*(0.5-(-1.0))) = 0.5374; loss = 1 - 0.5374 = 0.4626. Recomputed in Python 2026-11-10."
    limitations:
