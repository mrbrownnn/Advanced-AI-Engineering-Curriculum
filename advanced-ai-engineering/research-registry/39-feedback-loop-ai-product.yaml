    claim: "Sharma et al. report that five AI assistants were sycophantic across four free-form tasks: for example Claude 1.3 wrongly admitted mistakes on 98% of questions when challenged, and a user suggesting a wrong answer reduced accuracy by up to 27% (LLaMA 2)."
