  - id: CLM-048
    claim: "Accept, copy, and thumbs-up events measure reliance or approval, not correctness: the overreliance rate is accepted-incorrect / incorrect-shown and requires seeded or adjudicated incorrect answers to compute; a trust-UI change can raise acceptance of incorrect answers (synthetic example: 124/200 = 0.62 to 150/200 = 0.75) while satisfaction-type metrics favor it, and a design that reduces overreliance can lower satisfaction."
