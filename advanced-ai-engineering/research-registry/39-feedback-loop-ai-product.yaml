  - id: CLM-043
    claim: "For a 50/50 design the Pearson SRM statistic with df = 1 gives: 50,500 vs 49,500 users, chi2 = 10.0, p = 1.57e-3 (no alert at a 0.001 threshold, alert at 0.01); 50,600 vs 49,400, chi2 = 14.4, p = 1.48e-4 (alert); 50,300 vs 49,700, p = 0.058; and the same 1% relative split skew at 1,000 users (505 vs 495) gives p = 0.75. A three-arm 30/30/40 design with 30,600/29,400/40,000 gives chi2 = 24.0, df = 2, p = 6.1e-6."
    provenance: "DERIVED"
    domain: "online_experimentation"
    concepts: ["sample_ratio_mismatch", "pearson_chi_square"]
    confidence: "high"
    assumptions:
      - "Counts are synthetic; assignment unit counts are independent draws under the designed split."
    derivation: "chi2 = sum (o-e)^2/e. 50,500/49,500: 2*500^2/50,000 = 10.0; scipy chi2.sf(10,1) = 0.001565. 50,600/49,400: 2*600^2/50,000 = 14.4; sf = 1.478e-4. 50,300/49,700: 3.6; sf = 0.0578. 505/495: 2*25/500 = 0.1; sf = 0.752. Three-arm: e = 30,000/30,000/40,000; (600^2+600^2)/30,000 = 24.0; chi2.sf(24,2) = 6.14e-6. Recomputed in Python 2026-11-10."
    limitations:
      - "A p-value checked repeatedly during an experiment is not a fixed-n test (see CLM-026)."
    applicability: "Calibrating intuition for SRM magnitude versus sample size."
    related_claims: ["CLM-029", "CLM-030"]
    curriculum_usage:
      lessons: ["39.5"]
      labs: ["LAB-D"]

  - id: CLM-044
    claim: "For var(mean(Y) - theta*mean(X)) = (sigma_Y^2 + theta^2*sigma_X^2 - 2*theta*cov)/n, setting the derivative to zero gives theta* = cov/sigma_X^2 and variance sigma_Y^2*(1 - rho^2)/n, so users needed scale by (1 - rho^2): rho ~= 0.71 gives about 50% reduction and a reduction under 5% implies rho < 0.224. If only a fraction c of users has pre-period data and the rest receive a constant covariate, the reduction is approximately c*rho^2 under homogeneity (an approximation to verify)."
    provenance: "DERIVED"
    domain: "online_experimentation"
    concepts: ["cuped", "variance_reduction"]
    confidence: "high"
    assumptions:
      - "Pre-period covariate X unaffected by treatment; equal theta across arms."
      - "Coverage approximation assumes users with and without pre-period data have the same outcome variance and correlation."
    derivation: "d/dtheta: 2*theta*sigma_X^2 - 2*cov = 0. Substituting: sigma_Y^2 - cov^2/sigma_X^2 = sigma_Y^2*(1 - rho^2). 1 - 0.71^2 = 0.496. 1 - rho^2 > 0.95 gives rho < sqrt(0.05) = 0.2236. Coverage: users without X contribute unreduced variance, giving total factor about (1 - c*rho^2)."
    limitations:
      - "Coverage formula is an approximation, not a source result."
    applicability: "Predicting CUPED benefit before running an experiment."
    related_claims: ["CLM-022", "CLM-023", "CLM-031"]
    curriculum_usage:
      lessons: ["39.5"]
      labs: ["LAB-D"]

  - id: CLM-045
    claim: "For two independent arms under the normal approximation, n_per_arm ~= 2*(z_{1-alpha/2} + z_{1-beta})^2*sigma^2/delta^2 = 15.70*sigma^2/delta^2 at alpha = 0.05 and power 0.80. With sigma = 4 and delta = 0.1 this is 25,117 per arm; CUPED at rho = 0.6 multiplies it by 0.64 (16,075), and with 70% pre-period coverage by about 0.748 (18,788). For a thumbs-up rate p = 0.3 per user, sigma^2 = 0.21 and delta = 0.02 gives 8,242 per arm. If a test sized at 16,075 per arm on the CUPED assumption is analyzed without adjustment (for example after a silent fallback), power at the planned delta falls from 0.80 to about 0.61."
    provenance: "DERIVED"
    domain: "online_experimentation"
    concepts: ["sample_size_planning", "cuped"]
    confidence: "high"
    assumptions:
      - "Independent users, equal arm sizes, equal variance, normal approximation; inputs are synthetic."
      - "Bernoulli variance p(1-p) for a per-user binary outcome."
    derivation: "2*(1.959964 + 0.841621)^2 = 15.6978. 15.6978*16/0.01 = 25,116.4 -> 25,117. *0.64 = 16,074.5 -> 16,075. *(1 - 0.7*0.36) = *0.748 = 18,787.1 -> 18,788. 15.6978*0.21/0.0004 = 8,241.3 -> 8,242. Fallback power: SE = sqrt(2*16/16,075) = 0.04462; Phi(0.1/0.04462 - 1.959964) = Phi(0.2812) = 0.611. Recomputed in Python 2026-11-10."
    limitations:
      - "Per-response metrics with user randomization need the delta method (CLM-032), not this formula."
    applicability: "Planning an LLM feature A/B test; complements Module 15 Lesson 15.4 paired planning."
    related_claims: ["CLM-044"]
    curriculum_usage:
      lessons: ["39.5"]
      labs: ["LAB-D"]

  - id: CLM-046
    claim: "Applying the KTO imbalance rule to thumbs logs with 1 up : 4 down and lambda_U = 1 gives lambda_D in [4, 6]. At beta = 0.1 and z_0 = 0.5, a desirable output with r_theta = 2.0 has v/lambda_D = sigmoid(0.15) = 0.537, and an undesirable output with r_theta = -1.0 has v/lambda_U = sigmoid(0.15) = 0.537, so with lambda_D = 5 the per-example losses are 2.313 and 0.463."
