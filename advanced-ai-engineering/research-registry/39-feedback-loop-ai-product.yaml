claims:
  - id: CLM-001
    claim: "In an eye-tracking study of web search (Phase I 34 participants; Phase II 22 participants in normal, swapped-top-2, and reversed conditions), Joachims et al. report that clicks are informative but biased by trust in the ranking and by overall result quality; in the reversed condition the mean clicked rank moved from 2.66 to 4.03 and clicks per query fell from 0.80 to 0.64."
    provenance: "VERIFIED_FACT"
    domain: "implicit_feedback"
    concepts: ["implicit_feedback", "presentation_bias", "trust_bias"]
    confidence: "high"
    evidence:
      - source_type: "paper"
        tier: 1
        title: "Accurately Interpreting Clickthrough Data as Implicit Feedback"
        authors: "Thorsten Joachims, Laura Granka, Bing Pan, Helene Hembrooke, Geri Gay"
        year: "2005"
        url: "https://www.cs.cornell.edu/people/tj/publications/joachims_etal_05a.pdf"
        version: "SIGIR 2005; DOI 10.1145/1076034.1076063 (Crossref-verified)"
        section: "Full text read 2026-11-10"
        accessed_at: "2026-11-10"
    limitations:
      - "Small undergraduate samples, one 2005 web search engine; transfer to LLM interfaces is hypothesis CLM-055."
    applicability: "Reference evidence that an implicit signal mixes relevance with presentation."
    related_claims: ["CLM-002", "CLM-055"]
    curriculum_usage:
      lessons: ["39.1", "39.2"]
      labs: ["LAB-B"]

  - id: CLM-002
    claim: "Joachims et al. (2005) report that relative preferences extracted as 'Click > Skip Above' agreed with explicit judgments 80.8 +/- 3.6% in Phase I against 89.5% inter-judge agreement and did not change significantly under swapped and reversed rankings, while 'Click > Earlier Click' was unreliable (36.8% swapped, 28.6% reversed)."
    provenance: "VERIFIED_FACT"
    domain: "implicit_feedback"
    concepts: ["relative_preference_extraction", "implicit_feedback"]
    confidence: "high"
    evidence:
      - source_type: "paper"
        tier: 1
        title: "Accurately Interpreting Clickthrough Data as Implicit Feedback"
        authors: "Thorsten Joachims, Laura Granka, Bing Pan, Helene Hembrooke, Geri Gay"
        year: "2005"
        url: "https://www.cs.cornell.edu/people/tj/publications/joachims_etal_05a.pdf"
        section: "Full text read 2026-11-10"
        accessed_at: "2026-11-10"
    limitations:
      - "Same population and era limits as CLM-001."
    applicability: "Why relative interpretations of implicit signals can be more robust than absolute ones."
    related_claims: ["CLM-001"]
    curriculum_usage:
      lessons: ["39.2"]
      labs: ["LAB-B"]

  - id: CLM-003
    claim: "Joachims, Swaminathan, and Schnabel show that an inverse-propensity-scored (IPS) ranking risk estimator is unbiased when examination propensities are positive and depend only on observables; under a position-based model P(click) = P(examine | rank) * P(click | relevant, examined), propensities need only be known up to a constant, and a swap intervention between ranks k and r gives click-rate ratios proportional to the propensity, which the authors describe as much less harmful than uniform randomization. With click noise the IPS risk is biased but order preserving."
    provenance: "VERIFIED_FACT"
    domain: "bias_correction"
    concepts: ["inverse_propensity_weighting", "position_bias", "swap_intervention"]
    confidence: "high"
    evidence:
      - source_type: "paper"
        tier: 1
        title: "Unbiased Learning-to-Rank with Biased Feedback"
        authors: "Thorsten Joachims, Adith Swaminathan, Tobias Schnabel"
        year: "2017"
        url: "https://arxiv.org/abs/1608.04468"
        version: "arXiv v1 (2016-08-16); WSDM 2017, DOI 10.1145/3018661.3018699"
        section: "Full text read 2026-11-10"
        accessed_at: "2026-11-10"
    limitations:
      - "The abstract claims an operational deployment; its numbers were not extracted."
      - "Unbiasedness fails if propensity depends on unobserved quality (CLM-056)."
    applicability: "Reference/baseline method for propensity correction of position-biased feedback."
    related_claims: ["CLM-041", "CLM-055", "CLM-056"]
    curriculum_usage:
      lessons: ["39.2"]
      labs: ["LAB-A", "LAB-B"]

