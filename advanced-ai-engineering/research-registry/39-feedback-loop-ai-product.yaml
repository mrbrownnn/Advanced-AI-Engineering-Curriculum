    derivation: "Let E be exposed responses and F the feedback events. Share up/F conditions on F > 0; rate up/E does not. Without E, nonresponders are invisible, so any estimator using only F inherits the propensity bias of CLM-040. Async ingestion means F counted at time t may be incomplete relative to E."
