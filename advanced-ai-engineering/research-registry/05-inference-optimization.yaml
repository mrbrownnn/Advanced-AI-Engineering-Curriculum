  - id: CLM-004
    claim: "A quantized inference configuration is not identified by bit width alone: storage encoding, weight/activation coverage, scale and zero-point representation, scaling granularity, calibration data, clipping, accumulation dtype, packing layout, and executable kernel support jointly determine memory, quality, and speed."
    provenance: DERIVED
    domain: quantization
    concepts: [quantization_contract, scaling_granularity, accumulation_dtype, kernel_support]
    confidence: high
    currentness_status: "REFERENCE / BASELINE"
    assumptions:
      - "The implementation stores quantized values plus metadata and executes dequantization or native low-precision arithmetic through a concrete kernel path."
      - "Quality is evaluated on an explicitly declared workload rather than inferred from bit width."
    derivation: "The stored representation determines bytes and representable values; scaling and calibration determine quantization error; accumulation determines numerical range; packing and kernel support determine whether hardware can avoid conversion and execute the intended low-precision path. Therefore equal nominal bit widths do not imply equal artifacts, quality, or performance."
    limitations:
      - "This decomposition predicts required measurements, not a speedup or quality delta."
    applicability: "FP8, INT8, INT4, and mixed-precision inference evaluations."
    curriculum_usage:
      lessons: ["5.3", "5.4"]
      labs: ["LAB-C"]
      assessments: ["Mastery-05"]

