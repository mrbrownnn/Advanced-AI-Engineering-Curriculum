  - id: CLM-015
    claim: "An optimization-stack regression can arise when a change reduces one local cost but shifts the bottleneck or adds conversion, compilation, synchronization, workspace, or quality-recovery costs; the explanation is supported only if time-aligned profiles and controlled ablations show the added cost and the end-to-end regression."
    provenance: HYPOTHESIS
    domain: diagnostic_methodology
    concepts: [bottleneck_shift, optimization_interaction, controlled_ablation]
    confidence: high
    currentness_status: "REFERENCE / BASELINE"
    hypothesis:
      prediction: "Enabling the suspect optimization changes kernel mix, conversion or launch counts, resource counters, memory footprint, or acceptance behavior before end-to-end latency, throughput, goodput, or quality regresses."
      measurement_target: "Pinned binary and configuration; numerical outputs; warm and cold latency; per-shape GPU timeline; generated kernels; HBM traffic; occupancy and registers; workspace and peak memory; accepted tokens per verification; quality and SLO-goodput."
      falsifying_observation: "A controlled one-factor toggle reproduces neither the alleged added cost nor the end-to-end regression across the affected workload, while another measured component fully explains the change."
    limitations:
      - "Multiple interacting changes may require factorial experiments rather than a single toggle."
      - "Profiler perturbation and nondeterminism require repeated measurements and declared uncertainty."
    applicability: "Post-deployment regressions involving fused kernels, quantization, compiler paths, or speculative decoding."
    curriculum_usage:
      lessons: ["5.7"]
      labs: ["LAB-B", "LAB-C", "LAB-D"]
      assessments: ["Incident-05.1", "Mastery-05"]

