  - id: CLM-009
    claim: "Leases without fencing cannot prevent a paused or partitioned stale worker from writing after a new owner takes over; monotonically increasing fencing tokens must be checked by the protected resource."
    provenance: DERIVED
    domain: concurrency_control
    concepts: [lease, fencing_token, stale_worker]
    confidence: high
    currentness_status: "RECOMMENDED BASELINE WHEN CONCURRENT OWNERSHIP EXISTS (module derivation; adoption not measured)"
    assumptions: ["Workers can pause beyond lease expiry and the protected resource can compare a monotonic token or equivalent epoch."]
    derivation: "Lease expiry grants a new owner but does not revoke the old process's ability to execute. Rejecting operations with a token older than the last accepted epoch closes that stale-writer path."
    limitations: ["Fencing protects resources that enforce it; it does not revoke already-issued irreversible effects.", "A resource that compares against the highest epoch it has seen still accepts a stale write that arrives after the new grant but before the new owner's first write; a barrier write or a check against the lease service closes that window.", "The rule accepts an epoch equal to the last accepted one because an epoch identifies the owner, who issues many writes under it; repeated operations are guarded by the idempotency key, not by the epoch. This differs on purpose from a per-record source version, where only a strictly newer value is accepted."]
    applicability: "Worker ownership, singleton workflows, and external resources with concurrent writers."
    curriculum_usage: { lessons: ["14.3"], labs: ["LAB-C"], assessments: ["Incident-14.1"] }
