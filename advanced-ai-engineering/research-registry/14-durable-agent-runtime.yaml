  - id: CLM-019
    claim: "A receiver transaction that, in one atomic step, checks the ownership epoch, inserts the (scope, key) record under a unique constraint, applies the effect, and stores the outcome returns the stored outcome for the same key and intent, rejects the same key with a different intent, and applies at most once per key within retention; crash-before-dispatch, receiver-crash-before-commit, and commit-without-acknowledgement leave the same durable history prefix, so recovery must use an action that is safe in all three."
    provenance: DERIVED
    domain: idempotency
    concepts: [receiver_transaction, commit_without_ack, key_conflict]
    confidence: high
    currentness_status: "RECOMMENDED BASELINE (module derivation; adoption not measured)"
    assumptions: ["The receiver can commit the key record, the effect, and the outcome in one transaction or one conditional write.", "The sender derives the key deterministically from workflow identity and logical step.", "Key records are retained longer than the retry and redelivery window."]
    derivation: "In all three windows the history holds the scheduled event and no completion, so history cannot distinguish them. Redispatch with the same key and intent applies the effect when no record exists and returns the stored outcome when one exists. A unique constraint serializes concurrent inserts, so two attempts cannot both observe absence. Comparing the stored intent hash separates a retry from key reuse. After a record is purged the key is indistinguishable from a new one, so the property holds only inside retention. Fixture check: balance 100, debit 30 gives 70 in every covered case; a new key or a purged key gives 40."
    limitations: ["Synthetic fixture checked with a local single-node transactional store; cross-region replication, downstream fan-out from the receiver, and third parties without such a transaction are not covered.", "Convergence to one effect at this receiver is not exactly-once execution of the activity.", "After a key record is purged the key gives no protection; a receiver that purges keys needs a guard that does not expire with them, such as a version or base-state check for absolute writes or a ledger or postcondition lookup for relative effects."]
    applicability: "Receiver design and crash-matrix oracles for retryable external effects; referenced by Module 10 for index writes."
    related_claims: ["CLM-004", "CLM-005", "CLM-017"]
    curriculum_usage: { lessons: ["14.2", "14.5"], labs: ["LAB-B"], assessments: ["Mastery-14", "Incident-14.1"] }
