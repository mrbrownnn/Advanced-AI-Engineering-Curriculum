  - id: "CLM-013"
    claim: "Under memory pressure, rising block churn, evictions, preemptions, or recomputation can form a feedback loop that lowers useful progress, but these signals do not uniquely prove KV-capacity thrashing without aligned allocation, scheduler, cache-hit, transfer, and timeline evidence."
    provenance: "HYPOTHESIS"
    domain: "diagnostic_methodology"
    concepts: ["memory_pressure", "thrashing", "preemption", "competing_hypotheses"]
    confidence: "high"
    hypothesis:
      prediction: "As free-block headroom shrinks under a fixed workload, allocation failures or evictions will rise, requests will lose/reload/recompute state, and useful tokens per unit time will fall; increasing only KV headroom should reverse those linked signals."
      measurement_target: "Align free/used/evictable blocks, per-request logical demand, prefix hits, allocations/frees, preemptions, recomputed tokens, transfer bytes, scheduler decisions, GPU timeline, and useful token progress."
      falsifying_observation: "Changing KV headroom while holding workload and scheduling policy fixed does not change churn, recomputation/transfer, or useful progress, and another controlled intervention fully explains the symptom."
    limitations:
      - "High memory use alone is not thrashing; low cache hit rate may simply reflect low prefix locality."
    applicability: "KV incidents at the allocator/scheduler boundary."
    curriculum_usage:
      lessons: ["3.5", "3.10"]
      labs: ["LAB-E"]
      assessments: ["Incident-03.1", "Mastery-03"]

