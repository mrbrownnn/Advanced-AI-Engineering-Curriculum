  - id: "CLM-015"
    claim: "Under the MLA retained-state model, logical KV payload per token is bytes_per_element*l*(d_c+d_h^R); with DeepSeek-V2 values and 2-byte elements this is 69,120 bytes (67.5 KiB) per token and 270 MiB for a 4,096-token request, whereas inserting num_key_value_heads=128 and head_dim=128 into the GQA formula gives 3,932,160 bytes (3.75 MiB) per token, about 56.9x larger."
    provenance: "DERIVED"
    domain: "memory_accounting"
    concepts: ["mla", "bytes_per_token", "config_field_trap"]
    confidence: "high"
    assumptions:
      - "One latent and one decoupled RoPE key per layer per token as in CLM-014; no per-head K/V cached."
      - "2 bytes per element is an exercise assumption; no padding, scales, or allocator rounding."
    derivation: "2*60*(512+64)=69,120 bytes; 69,120/1024=67.5 KiB; 69,120*4096/2^20=270 MiB. GQA misuse: 2*2*60*128*128=3,932,160 bytes = 3.75 MiB; ratio 56.89."
    limitations:
