  - id: "CLM-016"
    claim: "Whether delaying or admitting a request under KV pressure lowers per-token latency (TPOT/ITL) of running requests cannot be inferred from free-block counts; it depends on the completion and reclaim timeline, the preemption and victim policy, and the measured per-iteration cost as a function of resident batch and scheduled prefill work."
    provenance: "HYPOTHESIS"
    domain: "diagnostic_methodology"
    concepts: ["admission", "tpot", "prefill_interference", "preemption", "timeline"]
    confidence: "high"
    hypothesis:
      prediction: "For a fixed block state, runs that differ only in completion timing or in the step-cost function will show different signs or magnitudes of the TPOT change caused by admission; when admission forces preemption with recomputation, running requests' mean gaps rise, and when it does not, delaying mostly relocates prefill interference rather than removing it."
      measurement_target: "Per-iteration duration with resident batch size and scheduled prefill tokens; per-request token emission timestamps; free/allocatable block trace; preemption events and recomputed tokens."
      falsifying_observation: "Across controlled runs with the same block state but different completion timing and batch/prefill cost profiles, the TPOT change caused by admission is invariant and fully predicted by the free-block count."
    limitations:
      - "Policy effects on queueing, fairness, and SLO attainment are owned by Module 04."
    applicability: "Lesson 3.5 admission reasoning and Incident 03.1."
    related_claims: ["CLM-013", "CLM-017"]
    curriculum_usage:
      lessons: ["3.5"]
      labs: ["LAB-B"]
      assessments: ["Incident-03.1", "Mastery-03"]

  - id: "CLM-017"
    claim: "In the Lesson 3.5 synthetic model (10 free blocks; A +4 and B +8 blocks of growth; C needs 6; 16-token blocks; youngest-victim recompute), admitting C leaves 10-6=4 free blocks; if A uses its full growth, admission forces one preemption at iteration 17 and raises A's and B's mean gaps under both step-cost models, while if A stops after 12 tokens there is no preemption and B's mean gap is identical under admit-now and delay (20.375 ms under K1, 22.4375 ms under K2)."
    provenance: "DERIVED"
    domain: "scheduler_allocator_interface"
    concepts: ["admission", "timeline", "preemption", "synthetic_example"]
    confidence: "high"
    assumptions:
      - "All quantities are exercise assumptions: block size 16; A holds 6 and B 8 blocks with full tails; C has a 96-token prompt and emits 32 tokens; completions free all blocks."
      - "K1: 20 ms per decode iteration for batch 1-3 plus 0.5 ms per scheduled prefill token; K2: 14+6*batch ms plus the same prefill term."
      - "Allocation order per iteration: running requests, then admission; shortfall preempts the youngest request and recomputes its prompt plus generated tokens on re-admission."
    derivation: "Iteration-by-iteration replay. T1/K1 admit-now: iteration 1 = 20+0.5*96 = 68 ms; shortfall at iteration 17 preempts C; re-prefill of 112 tokens at iteration 65 = 76 ms; A = (63*20+68)/64 = 20.75 ms; B = (126*20+68+76)/128 = 20.8125 ms. T1/K1 delay: A = 20 ms; B = (127*20+68)/128 = 20.375 ms; C TTFT = 64*20+68 = 1,348 ms. T2 (A stops after 12): no shortfall; B's multiset of (batch, prefill) iterations is the same under both policies, so B's mean gap is equal."
    limitations:
