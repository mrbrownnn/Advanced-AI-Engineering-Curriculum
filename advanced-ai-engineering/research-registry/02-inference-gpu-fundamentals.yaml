  - id: "CLM-005"
    claim: "Under an explicitly chosen work count W, transferred-byte count Q, attainable compute rate P_peak, and attainable bandwidth beta, the basic Roofline bound is P <= min(P_peak, beta*W/Q), with ridge intensity I_star=P_peak/beta."
    provenance: "DERIVED"
    domain: "performance_model"
    concepts: ["roofline_equation", "ridge_point", "units"]
    confidence: "high"
    assumptions:
      - "W and P_peak use the same operation convention and precision path."
      - "Q and beta refer to the same memory-hierarchy boundary."
      - "The workload is large and parallel enough for throughput ceilings to be meaningful."
      - "Compute and data movement can overlap as represented by the basic Roofline abstraction."
    derivation: "I=W/Q has units operations/byte. The compute ceiling gives P<=P_peak and the selected memory boundary gives P<=beta*I. Taking both constraints yields the minimum; equality of the two ceilings gives I_star=P_peak/beta."
    limitations:
      - "This is an analytical upper bound, not a latency prediction or proof of the observed bottleneck."
    applicability: "Unit-checked Roofline calculations and falsifiable profiler predictions."
    related_claims: ["CLM-004"]
    curriculum_usage:
      lessons: ["2.4"]
      labs: ["LAB-C"]
      assessments: ["Mastery-02"]

