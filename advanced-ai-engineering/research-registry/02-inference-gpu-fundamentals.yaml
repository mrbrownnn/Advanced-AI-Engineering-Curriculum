    claim: "CUDA launches a grid of thread blocks; SMs execute threads in groups of 32 called warps, and an application cannot rely on a particular ordering of thread blocks. Divergent paths within a warp can reduce execution efficiency even though threads retain individual state."
    provenance: "VERIFIED_FACT"
    domain: "execution_model"
    concepts: ["grid", "thread_block", "warp", "simt", "divergence"]
    confidence: "high"
    evidence:
