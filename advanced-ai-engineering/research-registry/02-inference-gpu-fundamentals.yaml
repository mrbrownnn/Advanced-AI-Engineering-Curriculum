  - id: "CLM-010"
    claim: "For a timed kernel interval t seconds with B_r useful bytes read and B_w useful bytes written, effective bandwidth is (B_r+B_w)/t; comparing requested/effective bytes with measured transferred bytes can reveal inefficient transactions, but neither value alone identifies the cause."
    provenance: "DERIVED"
    domain: "memory_measurement"
    concepts: ["effective_bandwidth", "requested_bandwidth", "actual_bandwidth", "units"]
    confidence: "high"
    assumptions:
      - "The byte count covers the same operation and timing interval."
      - "Read/write multiplicity and units (GB versus GiB) are stated."
      - "The calculation concerns useful/requested bytes; profiler counters are required for actual hierarchy traffic."
    derivation: "Bandwidth is transferred quantity divided by elapsed time. Summing useful bytes read and written and dividing by seconds yields bytes/second; divide by 10^9 for decimal GB/s or 2^30 for GiB/s. Example: 4 MiB in 1 ms is 4,194,304,000 bytes/s = 4000 MiB/s = 3.90625 GiB/s = 4.194304 GB/s, not 4 GiB/s."
    limitations:
      - "Cache reuse, write allocation, compression, ECC, retries, and transaction granularity can make hardware traffic differ from useful bytes."
    applicability: "Coalescing experiments and memory-traffic reconciliation."
    related_claims: ["CLM-002"]
    curriculum_usage:
      lessons: ["2.2"]
      labs: ["LAB-A"]
      assessments: ["Mastery-02"]

