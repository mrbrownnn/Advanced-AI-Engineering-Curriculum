        tier: 2
        title: "CUDA Programming Guide"
        authors: "NVIDIA"
        version: "Live documentation verified 2026-09-25"
        url: "https://docs.nvidia.com/cuda/cuda-programming-guide/02-basics/writing-cuda-kernels.html"
        section: "Writing SIMT Kernels; Thread Hierarchy"
        accessed_at: "2026-09-25"
      - source_type: "official_docs"
        tier: 2
        title: "CUDA Programming Guide"
        authors: "NVIDIA"
        version: "Live documentation verified 2026-09-25"
