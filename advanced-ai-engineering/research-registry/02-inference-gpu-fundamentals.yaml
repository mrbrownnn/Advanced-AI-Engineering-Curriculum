      - "Detailed scheduling, resource limits, and supported instructions vary by compute capability."
      - "Independent thread scheduling on compute capability 7.0 and later does not make divergence free or justify implicit warp-synchronous code."
    applicability: "Reasoning about launch geometry, divergence, synchronization, and correctness boundaries."
    curriculum_usage:
      lessons: ["2.1"]
      labs: ["LAB-A"]
      assessments: ["Mastery-02"]

