  - id: "CLM-012"
    claim: "A single high-level utilization value, occupancy value, bandwidth percentage, or Roofline point is necessary evidence for some hypotheses but is insufficient to establish a unique bottleneck without aligned scope, timeline, stall, traffic, launch, and shape evidence."
    provenance: "HYPOTHESIS"
    domain: "diagnostic_methodology"
    concepts: ["bottleneck_diagnosis", "competing_hypotheses", "discriminating_measurement"]
    confidence: "high"
    hypothesis:
      prediction: "Workloads with a similar aggregate utilization metric can have materially different causes, including host launch gaps, insufficient grid size, dependency stalls, poor coalescing, throttling, or an efficient kernel completing quickly."
      measurement_target: "Align CPU/GPU timelines, kernel shapes, device clocks, achieved throughput, memory traffic by hierarchy, occupancy/resource limits, warp-stall samples, and controlled interventions."
      falsifying_observation: "Across representative controlled workloads, the selected aggregate metric uniquely predicts the causal limiter and the correct intervention without any additional measurements."
    limitations:
      - "The claim does not make every counter equally valuable; it requires selecting measurements that discriminate the live hypotheses."
    applicability: "Incident diagnosis and avoidance of exactly-one bottleneck classifiers."
    curriculum_usage:
      lessons: ["2.6"]
      labs: ["LAB-D"]
      assessments: ["Incident-02.1", "Mastery-02"]

