  - id: CLM-014
    claim: "With f_i and P_i each summing to 1 (top-1), N*sum_i f_i*P_i equals 1 under uniform routing and N when all tokens and probability go to one expert; because f_i is a non-differentiable count, the gradient of alpha*N*sum f_i P_i with respect to P_i is alpha*N*f_i, so the loss lowers router probability on experts in proportion to their current load."
    provenance: DERIVED
    domain: load_balancing
    concepts: [aux_load_balancing_loss, router_gradient]
    confidence: high
    currentness_status: "REFERENCE / BASELINE"
    assumptions: ["Switch normalization (CLM-003); for top-k, f_i normalized by T*k as in Megatron-Core (CLM-025) keeps the uniform value at 1."]
    derivation: "Uniform: f_i=P_i=1/N, so N*N*(1/N^2)=1. Full collapse onto expert j: f_j=P_j=1, so N*1=N. d/dP_i (alpha*N*sum f P) = alpha*N*f_i with f treated as constant. The loss is a proxy: its value depends on which tokens are in the batch over which f and P are computed."
    limitations: ["The loss can be near 1 while a few experts are starved if P and f anti-correlate; monitor MaxVio and per-expert load directly."]
    applicability: "Reading aux-loss curves and choosing alpha."
    related_claims: [CLM-003, CLM-013]
    curriculum_usage: { lessons: ["28.2"], labs: ["LAB-A"], assessments: ["Mastery-28"] }
