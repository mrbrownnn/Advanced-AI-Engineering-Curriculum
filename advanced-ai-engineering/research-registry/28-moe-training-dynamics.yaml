  - id: CLM-010
    claim: "In top-k routing without straight-through or noise tricks, the language-model loss reaches the router only through the gate values of the selected experts; the selection itself is non-differentiable, so for a given token unselected experts receive no task gradient and the router receives no task signal about them, which is the mechanical basis of the rich-get-richer dynamic."
    provenance: DERIVED
    domain: router_mechanics
    concepts: [top_k_gating, router_gradient, router_collapse]
    confidence: high
    currentness_status: "REFERENCE / BASELINE"
    assumptions: ["Output y = sum over selected experts of g_i * E_i(x); g computed by softmax or normalized sigmoid over selected logits; top-k selection treated as a constant index set in backward."]
    derivation: "dL/dW_e = 0 for every expert e not in the selected set, because E_e(x) does not appear in y. dL/dlogit_j for unselected j is zero when gates are softmax over selected logits only (topk-then-softmax) or normalized sigmoid over selected scores; with softmax-over-all-then-topk the unselected logits receive gradient only via the normalizer of selected probabilities, not via their own expert output. Hence experts that are already selected get trained and become better for their tokens, reinforcing selection (CLM-001)."
    limitations: ["Auxiliary losses (CLM-003) add gradient to all experts' router probabilities; noisy gating and Sinkhorn-style routing change the picture."]
    applicability: "Explaining collapse and why balancing must be added explicitly."
    related_claims: [CLM-001, CLM-003]
    curriculum_usage: { lessons: ["28.1", "28.2"], labs: ["LAB-A"], assessments: ["Mastery-28"] }
  - id: CLM-011
    claim: "Wang et al. vary the auxiliary-loss coefficient alpha over 1e-2, 1e-3, 1e-4, and 0 and report that a small alpha causes routing collapse while a large alpha keeps balance under control but notably degrades model performance; their auxiliary-loss baseline uses alpha=0.001 as a trade-off."
    provenance: VERIFIED_FACT
    domain: load_balancing
    concepts: [aux_load_balancing_loss, interference_gradient, router_collapse]
    confidence: high
    currentness_status: "REFERENCE / BASELINE"
