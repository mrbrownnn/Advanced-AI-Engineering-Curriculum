  - "Kimi K3 Quantile Balancing primary source (not opened; see CLM-053)."
claims:
  - id: CLM-001
    claim: "Shazeer et al. introduce the sparsely-gated MoE layer with noisy top-k gating G(x)=Softmax(KeepTopK(H(x),k)); they observe that the gating network tends to converge to always producing large weights for the same few experts, an imbalance that is self-reinforcing because favored experts train faster and are selected more; they add an importance loss w_importance*CV(Importance(X))^2."
    provenance: VERIFIED_FACT
    domain: router_mechanics
    concepts: [top_k_gating, router_collapse, importance_loss]
    confidence: high
    currentness_status: "REFERENCE / BASELINE"
    evidence: [{ source_type: paper, tier: 1, title: "Outrageously Large Neural Networks: The Sparsely-Gated Mixture-of-Experts Layer", authors: "Noam Shazeer, Azalia Mirhoseini, Krzysztof Maziarz, Andy Davis, Quoc Le, Geoffrey Hinton, Jeff Dean", year: "2017", url: "https://arxiv.org/abs/1701.06538", section: "Section 2.1 Gating network (noisy top-k); Section 4 Balancing expert utilization", accessed_at: "2026-10-12" }]
    limitations: ["LSTM-era MoE between recurrent layers; the self-reinforcement statement is an observation, not a measured rate."]
    applicability: "Origin of the collapse mechanism and of auxiliary balancing."
    curriculum_usage: { lessons: ["28.1", "28.2"], labs: ["LAB-A"], assessments: ["Mastery-28"] }
  - id: CLM-002
    claim: "Switch Transformer routes each token to a single expert (k=1, a 'Switch layer') using router probabilities p_i(x)=exp(h(x)_i)/sum_j exp(h(x)_j); for stability it casts the router input to float32 only inside the router (selective precision) and reduces the default Transformer initialization scale by a factor of 10."
    provenance: VERIFIED_FACT
    domain: router_mechanics
    concepts: [softmax_router, top_1_routing, selective_precision, init_scale]
    confidence: high
    currentness_status: "REFERENCE / BASELINE"
    evidence: [{ source_type: paper, tier: 1, title: "Switch Transformers: Scaling to Trillion Parameter Models with Simple and Efficient Sparsity", authors: "William Fedus, Barret Zoph, Noam Shazeer", year: "2021 (v3 2022, JMLR)", url: "https://arxiv.org/abs/2101.03961", section: "Section 2.1 Simplifying Sparse Routing; Section 2.4 Improved Training and Fine-Tuning Techniques", accessed_at: "2026-10-12" }]
