change_reason: "Initial authored module. Evidence opened 2026-10-12: Shazeer 2017, GShard, Switch, ST-MoE, Expert Choice, MegaBlocks, Sparse Upcycling, DeepSeekMoE, Auxiliary-Loss-Free Balancing, OLMoE, DeepSeek-V3, global-batch LBL, Qwen3, GSPO (MoE section); 2025-2026 frontier at abstract level (ALF-LB theory, Drop-Upcycling, Router Prior Bias, over-dispersed pruning, ID Balancing). Pinned static traces of Megatron-LM (Megatron-Core MoE router) and MegaBlocks."
