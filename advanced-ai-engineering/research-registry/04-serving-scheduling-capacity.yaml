    hypothesis:
      prediction: "Simultaneous telemetry tracking of queue wait (T_queue), prefill compute (T_prefill), decode step time (ITL), free KV block ratio, and preemption counters will identify whether a system is predominantly queueing-dominated, compute-saturated, or memory-exhausted, and will reveal causal transitions where one bottleneck triggers another."
