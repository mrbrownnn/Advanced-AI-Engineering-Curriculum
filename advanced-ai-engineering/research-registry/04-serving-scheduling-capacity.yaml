  - id: CLM-004
    claim: "For a stable observed population with consistent boundaries, Little's Law relates long-run averages as L=lambda*W; over a finite window it holds exactly when the boundary is empty at both ends (or when W counts only in-window time), independent of stationarity and queue discipline. L, lambda, and W must describe the same boundary: end-to-end L counts waiting, resident, and streaming requests and is not the resident GPU-sequence count, which needs lambda_admitted*E[T_resident]. Separately, an initially empty deterministic fluid model with constant arrival and departure rates, no loss, and lambda>mu gives Q(t)=(lambda-mu)t; that transient equation is not a consequence of Little's Law and is not a universal LLM queue trajectory."
    provenance: "DERIVED"
    domain: "queueing_theory"
    concepts:
      - "littles_law"
      - "arrival_rate"
      - "service_rate"
      - "queue_growth"
      - "stability_condition"
    confidence: "high"
    currentness_status: "REFERENCE / BASELINE"
    assumptions:
      - "The steady-state form of Little's Law uses a stable population, finite long-run averages, and identical arrival/residence boundaries."
      - "The fluid backlog equation additionally assumes constant rates, an initially empty queue, no drops/cancellations, and no state-dependent service-rate change."
      - "lambda is the rate of requests entering the chosen boundary (admitted, not offered, when rejections occur before the boundary)."
    derivation: "Little's Law follows from time-average conservation of customer-time over a stable observation horizon: with A the area under n(t) on [0,T], N arrivals, L=A/T, lambda=N/T, W=A/N, hence L=lambda*W (Little 2011, Theorem LL.1; LL.2 generalizes to nonempty ends with W=A/S(T)). The long-run version requires that the limits lambda and W exist and are finite. In the separate fluid exercise, cumulative arrivals are lambda*t and departures are mu*t while backlog remains positive, so Q(t)=max(0,(lambda-mu)t) from an initially empty queue."
    evidence:
      - source_type: "paper"
        tier: 1
        title: "Little's Law as Viewed on Its 50th Anniversary"
        authors: "John D. C. Little"
        year: "2011"
        url: "https://pubsonline.informs.org/doi/10.1287/opre.1110.0940"
        section: "Section 2 (Theorems LL.1 and LL.2, remarks on nonstationarity and queue discipline); Section 3 (sample-path and stationary versions). Full text read 2026-09-30 from a course-hosted copy of Operations Research 59(3):536-549."
        accessed_at: "2026-09-30"
    limitations:
      - "A finite-window transient needs boundary corrections or a sample-path formulation; plugging instantaneous burst rates into the steady-state identity is invalid."
      - "Batching, admission, cancellations, retries, and preemption can make effective departures state-dependent and invalidate the constant-rate fluid path."
    applicability: "Capacity planning, concurrency sizing, and queue residency estimation."
    related_claims: ["CLM-015"]
    curriculum_usage:
      lessons: ["4.4", "4.7"]
      labs: ["LAB-C"]
      assessments: ["Mastery-04"]

  - id: CLM-005
    claim: "In a stable FCFS M/G/1 model, the Pollaczek-Khinchine mean is W_q=lambda*E[S^2]/(2*(1-rho))=lambda*(sigma_S^2+1/mu^2)/(2*(1-rho)). Under those assumptions, greater service-time variance raises mean waiting; the equation neither identifies the tail distribution nor makes output-length variance equal service-time variance in a batching LLM runtime."
    provenance: "DERIVED"
    domain: "queueing_theory"
    concepts:
      - "pollaczek_khinchine_formula"
      - "service_time_variance"
      - "traffic_intensity"
      - "queue_wait_inflation"
    confidence: "high"
    currentness_status: "REFERENCE / BASELINE"
    assumptions:
      - "Poisson arrival process (independent exponential inter-arrival times)."
      - "Single server queueing abstraction with general service distribution G."
      - "Independent, identically distributed service demands independent of arrivals."
      - "Work-conserving FCFS service discipline without service-time-dependent priorities."
      - "Utilization rho < 1."
    derivation: "From P-K transform: Mean residual service time seen by an arrival is R = lambda * E[S^2] / 2 = lambda * (sigma^2 + 1/mu^2) / 2. By Little's Law, W_q = R / (1 - rho)."
    limitations:
      - "LLM continuous batching is multi-tenant and multi-token per step rather than a pure single-server FCFS queue."
      - "Arrivals in real systems often exhibit burstiness with dispersion parameter > 1."
    applicability: "Mean-wait sensitivity analysis and a check on whether measured service-demand variance could materially affect average queue residence under an explicit M/G/1 approximation."
    curriculum_usage:
      lessons: ["4.4"]
      labs: ["LAB-C"]
      assessments: ["Mastery-04", "Incident-04.1"]

