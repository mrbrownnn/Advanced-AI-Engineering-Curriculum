  - id: CLM-015
    claim: "For requests with N_out >= 2 output events observed at one boundary, T_e2e,r = TTFT_r + (N_r - 1)*TPOT_r exactly, so E[T_e2e] = E[TTFT] + E[(N_out - 1)*TPOT] = E[TTFT] + (E[N_out] - 1)*E[TPOT] + Cov(N_out, TPOT). The product of request means (mean(N_out) - 1)*mean(TPOT) is exact only when that covariance is zero or when TPOT is replaced by the gap-weighted mean sum(T_e2e - TTFT)/sum(N_out - 1) over the same population. Counterexample: requests (N=2, TPOT=10 ms) and (N=4, TPOT=2 ms) have mean post-first-output time 8 ms, while the product of request means gives 12 ms; the gap-weighted mean 4 ms times mean(N-1)=2 recovers 8 ms."
    provenance: "DERIVED"
    domain: "latency_metrics"
    concepts:
      - "ttft_itl_decomposition"
      - "tpot_aggregation"
      - "littles_law"
      - "concurrency_sizing"
    confidence: "high"
    currentness_status: "REFERENCE / BASELINE"
    assumptions:
      - "Same client- or engine-side observation boundary and population for TTFT, TPOT, and T_e2e."
      - "Each request has N_out >= 2 output events; N_out = 1 requests are reported as a separate class with T_e2e = TTFT."
      - "One observed event per token, or TPOT is consistently defined per event (see CLM-008)."
    derivation: "Take expectations of the per-request identity and expand E[XY] = E[X]E[Y] + Cov(X,Y) with X = N_out - 1 and Y = TPOT. For the counterexample: post-first-output times are 1*10 = 10 ms and 3*2 = 6 ms, mean 8 ms; mean(N-1) = 2, mean(TPOT) = 6 ms, product 12 ms; population covariance ((1-2)(10-6) + (3-2)(2-6))/2 = -4 ms, and 12 - 4 = 8 ms; gap-weighted mean 16 ms / 4 gaps = 4 ms, 2 * 4 = 8 ms. Recomputed independently in Python on 2026-09-30."
    limitations:
      - "An identity for means only; it gives no percentile or tail information."
      - "Stage-level TTFT and TPOT can also covary with N_out through batching and scheduling, so request-weighted means from dashboards may not satisfy the product form."
    applicability: "Concurrency sizing (Lesson 4.7 Step 2) and interpretation of aggregated TPOT/ITL dashboards."
    related_claims: ["CLM-004", "CLM-008"]
    curriculum_usage:
      lessons: ["4.1", "4.7"]
      assessments: ["Mastery-04"]

