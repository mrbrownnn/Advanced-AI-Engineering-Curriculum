    claim: "Production serving degradation can be diagnosed by ranking the relative contributions of interacting queueing, compute, and memory bottlenecks and detecting state transitions (e.g. an ingress queue burst transitioning into KV cache memory exhaustion and preemption thrashing) using correlated latency decomposition, queue residency, and memory pool telemetry."
