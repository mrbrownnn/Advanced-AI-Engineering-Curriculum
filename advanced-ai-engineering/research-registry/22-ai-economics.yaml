claims:
  - id: CLM-001
    claim: "FrugalGPT models the cost of one LLM API call as c_i(p) = c_i2*|f_i(p)| + c_i1*|p| + c_i0 (output length, prompt length, optional fixed per-query fee), reports that the fees of the APIs it reviewed differed by up to two orders of magnitude, and defines an LLM cascade that queries a list of APIs in order and returns the first answer whose learned reliability score exceeds a per-stage threshold; its authors report matching the best single model with up to 98% cost reduction on their evaluated datasets."
    provenance: VERIFIED_FACT
    domain: cascades
    concepts: [per_call_cost_model, llm_cascade, generation_scoring_function]
    confidence: high
    currentness_status: "REFERENCE / BASELINE"
    evidence: [{ source_type: paper, tier: 1, title: "FrugalGPT: How to Use Large Language Models While Reducing Cost and Improving Performance", authors: "Lingjiao Chen, Matei Zaharia, James Zou", year: "2023", url: "https://arxiv.org/abs/2305.05176", version: "v1", section: "Section 2 (LLM marketplace cost model; problem statement); Section 3 (Strategy 3: LLM cascade; constrained optimization over list and thresholds); Section 5 (limitations: needs labeled in-distribution training data)", accessed_at: "2026-10-01" }]
    limitations: ["The 98% figure is author-reported on HEADLINES with 2023 API prices; it is not a general savings rate.", "Cascade training needs labeled examples from the deployment distribution (the paper's Section 5).", "Prices used in the paper are historical and are not used in this module."]
    applicability: "Per-call cost model and the reference cascade mechanism."
    curriculum_usage: { lessons: ["22.3", "22.5"], labs: ["LAB-D"], assessments: ["Mastery-22"] }

  - id: CLM-002
    claim: "RouteLLM routes each query to a strong or weak model by comparing a learned estimate of the strong model's win probability with a threshold alpha (strong if the estimate is at least alpha), evaluates routers by call-performance threshold (CPT, the minimum share of strong-model calls that recovers a target share of the performance gap) and APGR, reports cost reductions of over 2x in certain cases without quality loss on its benchmarks, and reports router serving overhead small relative to generation cost in its Table 7."
    provenance: VERIFIED_FACT
    domain: routing
    concepts: [threshold_router, call_performance_threshold, router_overhead]
    confidence: high
    currentness_status: "REFERENCE / BASELINE"
    evidence: [{ source_type: paper, tier: 1, title: "RouteLLM: Learning to Route LLMs with Preference Data", authors: "Isaac Ong, Amjad Almahairi, Vincent Wu, Wei-Lin Chiang, Tianhao Wu, Joseph E. Gonzalez, M Waleed Kadous, Ion Stoica", year: "2024", url: "https://arxiv.org/abs/2406.18665", version: "v4 (2025-02-23)", section: "Section 3.1 (routing rule with threshold alpha); Section 3.2 (PGR, APGR, CPT); Section 5.5 and Table 7 (routing overhead)", accessed_at: "2026-10-01" }]
