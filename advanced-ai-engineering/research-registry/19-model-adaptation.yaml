  - id: CLM-028
    claim: "With token-mean cross-entropy over the included positions, the fraction of the training loss contributed by response tokens is the sum of response-token losses divided by the sum of included-token losses; the response token share equals this loss share only when prompt and response tokens have equal mean loss, and assistant-only masking changes the objective rather than merely reweighting it."
    provenance: DERIVED
    domain: adaptation_data
    concepts: [loss_masking, sft_data, loss_mass]
    confidence: high
    currentness_status: "REFERENCE / BASELINE"
    assumptions: ["Loss is the mean of per-token cross-entropy over positions included by the mask, with equal per-token weights."]
    derivation: "Loss share of the response = Σ_resp ℓ_t / (Σ_prompt ℓ_t + Σ_resp ℓ_t) = T_r·m_r / (T_p·m_p + T_r·m_r), which equals T_r/(T_p+T_r) iff m_p = m_r. With T_p=900, m_p=1, T_r=100, m_r=9 the response loss share is 900/1800 = 50% while its token share is 10%. Masking sets prompt weights to zero, so the gradient no longer includes prompt-prediction terms."
    limitations: ["Other reductions (per-sequence mean, sum, packing-aware weighting) change the arithmetic; gradient magnitude is not proportional to loss share.", "Whether masking improves a given task is an empirical question."]
