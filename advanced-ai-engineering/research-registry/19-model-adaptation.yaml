      measurement_target: "Paired per-item accuracy on changed facts with confidence intervals, retrieval recall on those items, format validity, tokens per request, training, re-gating, and index update cost, and regression suites."
      falsifying_observation: "The paired accuracy difference (RAG - retrained SFT) has an upper confidence bound below -delta, or index update cost exceeds retrain-plus-re-gate cost; or SFT format validity has an upper bound below prompt validity - delta, or C_adapt exceeds C_prompt over the horizon."
