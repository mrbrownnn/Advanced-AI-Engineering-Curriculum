claims:
  - id: CLM-001
    claim: "PPO's clipped surrogate objective is L^CLIP(theta) = E_t[min(r_t(theta) A_t, clip(r_t(theta), 1-eps, 1+eps) A_t)], with r_t(theta) the probability ratio between the current policy and the policy that collected the data; it is designed to allow multiple epochs of minibatch updates on the same samples."
    provenance: VERIFIED_FACT
    domain: policy_gradient_estimator
    concepts: [importance_ratio, ppo_clip]
    confidence: high
    currentness_status: "REFERENCE / BASELINE"
    evidence: [{ source_type: paper, tier: 1, title: "Proximal Policy Optimization Algorithms", authors: "John Schulman, Filip Wolski, Prafulla Dhariwal, Alec Radford, Oleg Klimov", year: "2017", url: "https://arxiv.org/abs/1707.06347", version: "v2", section: "Abstract; Section 3 Clipped Surrogate Objective, Equation 7", accessed_at: "2026-10-12" }]
    limitations: ["Clipping removes the incentive to move the ratio outside [1-eps, 1+eps] for the clipped sign of the advantage; it is not a hard trust-region constraint."]
    applicability: "Every PPO/GRPO-family LLM RL loss that uses a ratio against a data-collecting policy."
    curriculum_usage: { lessons: ["27.1"], labs: ["LAB-A"], assessments: ["Mastery-27"] }
  - id: CLM-002
