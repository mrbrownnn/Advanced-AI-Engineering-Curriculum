    derivation: "Cov_pi(log pi, pi A) = E_pi[log pi * pi A] - E_pi[log pi] E_pi[pi A]. Case 1 gives 0.098555, so the predicted dH = -0.1*0.098555 = -0.009855; recomputing the softmax after the update gives H from 0.80182 to 0.79191 (dH = -0.009906). Case 2 gives Cov = -0.032088, predicted +0.003209, exact +0.003210 (Python recomputation)."
    limitations: ["Tabular toy; real LLM updates move shared parameters and many states at once."]
