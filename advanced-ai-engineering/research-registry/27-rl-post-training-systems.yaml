  - id: CLM-017
    claim: "For a binary verifier with false-negative rate f_n on correct responses and false-positive rate f_p on incorrect ones, a policy whose responses are correct with probability q has expected reward q(1-f_n) + (1-q) f_p; the reward gap between a correct and an incorrect response is (1-f_n-f_p), so verifier errors shrink the learning signal, and if a response pattern raises f_p on incorrect answers the policy can increase reward while q falls."
    provenance: DERIVED
    domain: verifier_design
    concepts: [verifier_false_negative, verifier_false_positive, reward_hacking]
    confidence: high
    currentness_status: "REFERENCE / BASELINE"
    assumptions: ["Verifier errors are conditionally independent of anything except correctness and the pattern considered.", "Binary reward in {0,1}."]
    derivation: "E[r] = P(correct)P(r=1|correct) + P(incorrect)P(r=1|incorrect). With f_n=0.14, f_p=0.01, q=0.60: E[r]=0.60*0.86+0.40*0.01=0.520. A hacking policy with q=0.30 whose incorrect answers use a pattern with f_p=0.90 gets 0.30*0.86+0.70*0.90=0.888 > 0.520."
    limitations: ["Real verifier errors correlate with difficulty, format, and policy behavior; f_n and f_p drift as the policy changes (CLM-014)."]
    applicability: "Budgeting verifier error before RL and designing audits."
    related_claims: [CLM-014, CLM-019]
