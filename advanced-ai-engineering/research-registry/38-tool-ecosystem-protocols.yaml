    derivation: "A caller built for the old schema emits instances in L(old_in); the new server accepts L(new_in); safe iff L(old_in) is a subset of L(new_in). A consumer built for the old output schema accepts L(old_out); the new server emits L(new_out); safe iff L(new_out) is a subset of L(old_out). Classify each change by whether it widens or narrows the accepted set."
    limitations: ["Language inclusion for full JSON Schema is not decidable by simple rules in general; use rule-based classification plus fixture tests.", "Semantic changes with identical schemas are not caught."]
