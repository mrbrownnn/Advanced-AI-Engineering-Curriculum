  - id: CLM-053
    claim: "For a pipeline that retrieves a shortlist of K tools and lets the model choose, P(correct call) = P(gold in shortlist | K) * P(model chooses gold | gold shown, K) * P(arguments valid | gold chosen). The first factor is non-decreasing in K. The second can fall as K grows because more competitors are shown. The best K depends on how the two factors trade off on the workload."
