    claim: "For a tool schema change, input compatibility holds if every argument object valid under the old inputSchema is also valid under the new one. Output compatibility holds if every structured result valid under the new outputSchema is also valid under the old one. Adding an optional input property, or relaxing an input constraint, keeps input compatibility. Adding a required input property, narrowing an enum, or tightening a bound breaks it. Adding a required output property keeps output compatibility for consumers that allow extra properties."
