  - id: CLM-016
    claim: "MCP scope selection (2026-07-28): during initial authorization, clients SHOULD use the scope from the WWW-Authenticate challenge of the 401 response, and if none is given, all scopes in scopes_supported from the Protected Resource Metadata. Clients MUST treat challenged scopes as authoritative for the current operation. A runtime under-scoped request receives 403 insufficient_scope with scope= and resource_metadata, which triggers step-up re-authorization, and clients SHOULD request the union of previously granted and newly challenged scopes. The specification states that scopes_supported is intended to represent the minimal set needed for basic functionality, with additional scopes requested incrementally."
