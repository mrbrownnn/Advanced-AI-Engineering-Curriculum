    claim: "The context cost of a tool surface sent every turn is C_tools = c0 + sum over tools of (t_name + t_desc + t_schema), where c0 is the provider's fixed tool-use system-prompt overhead. From the per-server figures in CLM-026, the mean is 55,000/58 = 948.3 tokens per tool, but it varies by server: GitHub 26,000/35 = 742.9, Slack 21,000/11 = 1,909.1, Sentry and Grafana 600, Splunk 1,000. As a fraction of a declared window W = 200,000 tokens, 55K is f = 0.275 and the reported 134K is f = 0.67. Without caching, a session of n turns re-sends about n * C_tools tokens, for example 20 * (286 + 55,000) = 1,105,720 tokens."
    provenance: "DERIVED"
    domain: "tool_context_economics"
    concepts: ["tool_context_cost", "per_tool_token_budget"]
    confidence: "high"
    currentness_status: "REFERENCE / BASELINE"
    assumptions: ["Tool definitions are re-sent on every model call (stated by both vendors: billed as input tokens, injected into the system message).", "c0 = 286 tokens (Opus 5.5, tool_choice auto, CLM-024) is used only as an example.", "W = 200,000 tokens is an exercise value, not a property of any model."]
    derivation: "Sum of components. Per-tool means are server tokens divided by server tool count: 26000/35 = 742.857; 21000/11 = 1909.09; 3000/5 = 600; 2000/2 = 1000; 55000/58 = 948.28. f = 55000/200000 = 0.275; 134000/200000 = 0.67. Session: 20 * 55286 = 1,105,720. Recomputed in Python on 2026-11-10."
    limitations: ["The source token counts are approximate, so the per-tool means are approximate.", "Prompt caching changes the billed cost but not the context occupancy."]
    applicability: "Lesson 38.3 and Incident 38.1."
    related_claims: ["CLM-024", "CLM-026", "CLM-052"]
    curriculum_usage: { lessons: ["38.3"], labs: ["LAB-A"], assessments: ["Incident-38.1", "Mastery-38"] }

