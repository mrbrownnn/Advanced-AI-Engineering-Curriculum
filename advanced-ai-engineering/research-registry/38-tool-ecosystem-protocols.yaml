  - id: CLM-007
    claim: "MCP 2026-07-28 Tool fields are name, title, description, icons, inputSchema, optional outputSchema, and annotations. A name SHOULD be 1-128 characters from [A-Za-z0-9_.-] and is unique only within one server. inputSchema has root type object and defaults to the JSON Schema 2020-12 dialect, with any 2020-12 keyword allowed since SEP-2106. Aggregators SHOULD disambiguate colliding names, for example by prefixing a server id, and serverInfo.name is not guaranteed to be unique. The schema.ts doc comment on Tool warns that type constraints inside oneOf branches are not enforced for whichever branch does not match. The 2025-11-25 schema restricted inputSchema and outputSchema to {type: object, properties, required} (L1260-1284)."
    provenance: "VERIFIED_FACT"
    domain: "tool_protocols"
    concepts: ["tool_definition", "tool_name_rules", "schema_dialect", "name_collision"]
