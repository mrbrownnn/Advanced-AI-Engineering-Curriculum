  - id: CLM-061
    claim: "A simple exposure measure for a token is E = sum over intervals of |granted scopes| * interval length (scope-seconds). Requesting all four of four scopes for a 3,600 s token gives E = 14,400. Starting with one scope and stepping up to the union of two scopes at 1,800 s gives 1*1,800 + 2*1,800 = 5,400, or 2.67 times less, at the cost of one extra authorization round trip. The specification's fallback of requesting all of scopes_supported (CLM-016) maximizes |granted scopes| unless scopes_supported is kept minimal."
