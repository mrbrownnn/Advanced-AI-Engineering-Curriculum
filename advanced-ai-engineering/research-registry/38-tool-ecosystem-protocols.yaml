  - id: CLM-003
    claim: "In MCP 2026-07-28, SSE resumability with Last-Event-ID is removed, so a broken stream means the request is re-issued with a new id. Every result carries a resultType of complete or input_required, and a result without it is treated as complete. Multi Round-Trip Requests replace server-initiated sampling/createMessage, elicitation/create, and roots/list. Extensions are negotiated through capabilities.extensions, and Tasks moved to the extension io.modelcontextprotocol/tasks."
    provenance: "VERIFIED_FACT"
    domain: "tool_protocols"
    concepts: ["stateless_requests", "multi_round_trip_requests", "result_type"]
