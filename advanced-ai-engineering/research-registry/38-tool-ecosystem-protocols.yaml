    claim: "MCP server/tools.mdx (2026-07-28): tools/list returns the set of tools currently available to the requesting client. The set MUST NOT vary per connection or as a side effect of other requests, and MAY vary by the authorization presented on the request, for example returning only the tools the caller's granted scopes permit. Servers SHOULD return tools in a deterministic order. The stated reasons are reliable client caching and better LLM prompt cache hit rates when tools are included in model context."
