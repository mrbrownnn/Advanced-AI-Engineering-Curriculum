  - id: CLM-058
    claim: "If a server's tool list changes as a Poisson process with rate lambda and a client re-fetches every T seconds (TTL), the probability that the cached list is stale at a uniformly random read time is p_stale = 1 - (1 - exp(-lambda*T))/(lambda*T). For T = 300 s it is 0.17% at one change per day, 4.05% at one change per hour, and 21.3% at one change per 10 minutes."
    provenance: "DERIVED"
    domain: "tool_registry"
    concepts: ["cache_staleness", "cache_hints"]
    confidence: "high"
    currentness_status: "REFERENCE / BASELINE"
    assumptions: ["Changes form a Poisson process with constant rate lambda.", "Reads are uniform in time within each TTL interval.", "Fetch latency is negligible against T."]
    derivation: "A read at time u after the fetch is stale iff at least one change occurred in [0, u]: probability 1 - exp(-lambda*u). Averaging over u uniform on [0, T]: (1/T) * integral_0^T (1 - exp(-lambda*u)) du = 1 - (1 - exp(-lambda*T))/(lambda*T). x = lambda*T = 300/86400 = 0.003472 -> 0.001734; 300/3600 = 0.08333 -> 0.04053; 300/600 = 0.5 -> 0.21306. Recomputed in Python on 2026-11-10."
    limitations: ["Real tool changes are bursty (deployments), which the Poisson model does not capture.", "With a list_changed subscription, staleness is bounded by notification latency instead (CLM-068)."]
    applicability: "Lesson 38.4; LAB B."
    related_claims: ["CLM-006", "CLM-048", "CLM-068"]
    curriculum_usage: { lessons: ["38.4"], labs: ["LAB-B"], assessments: ["Mastery-38"] }

