claims:
  # ---------------- MCP specification 2026-07-28 (S1) ----------------
  - id: CLM-001
    claim: "MCP revision 2026-07-28 defines JSON-RPC 2.0 messages between hosts (LLM applications that initiate connections), clients (connectors inside the host), and servers. Servers offer Resources, Prompts, and Tools (functions the model executes). The architecture page states that full conversation history stays with the host and that the host process enforces security boundaries. The versioning page names 2026-07-28 as the current protocol version, schema.ts sets LATEST_PROTOCOL_VERSION to 2026-07-28, and the previous revision is 2025-11-25."
    provenance: "VERIFIED_FACT"
    domain: "tool_protocols"
    concepts: ["mcp_architecture", "host_client_server", "protocol_revision"]
    confidence: "high"
    currentness_status: "CURRENT DEFAULT (specification is current; adoption not surveyed)"
    evidence:
      - { source_type: "specification", tier: 1, title: "Model Context Protocol Specification, revision 2026-07-28", repository: "https://github.com/modelcontextprotocol/modelcontextprotocol", commit: "632a0c9a65c9b4fbc889d8aface5c9cf5edef3b7", file: "docs/specification/2026-07-28/index.mdx; schema/2026-07-28/schema.ts", section: "architecture/index.mdx; docs/docs/2026-07-28/learn/versioning.mdx; schema.ts L30", url: "https://github.com/modelcontextprotocol/modelcontextprotocol/tree/632a0c9a65c9b4fbc889d8aface5c9cf5edef3b7/docs/specification/2026-07-28", accessed_at: "2026-11-10" }
    limitations: ["The specification states normative intent. It does not show what any client or server enforces.", "A draft directory exists. Changes after 2026-07-28 were not reviewed."]
    applicability: "Wire-protocol vocabulary for Lessons 38.2 to 38.6."
    curriculum_usage: { lessons: ["38.2"], labs: ["LAB-B"], assessments: ["Mastery-38"] }

