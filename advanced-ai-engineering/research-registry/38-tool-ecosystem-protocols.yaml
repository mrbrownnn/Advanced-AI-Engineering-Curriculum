    concepts: ["scope_minimization", "step_up_authorization"]
    confidence: "medium"
    currentness_status: "REFERENCE / BASELINE"
    assumptions: ["Every scope is weighted equally; a weighted sum is needed when scopes differ in impact.", "The token is valid for its whole lifetime unless revoked.", "Synthetic scope counts and lifetimes."]
    derivation: "All-scopes: 4 * 3600 = 14,400. Step-up: 1 * 1800 + 2 * 1800 = 5,400. Ratio 14400/5400 = 2.667. Recomputed in Python on 2026-11-10."
    limitations: ["Scope-seconds is a proxy for blast radius, not a risk score. A narrow scope can still be high-impact."]
