  - id: CLM-008
    claim: "Under C = 6ND and L(N,D) = E + A/N^α + B/D^β, the compute-optimal allocation is N_opt = G(C/6)^a and D_opt = G^-1(C/6)^b with G = (αA/(βB))^(1/(α+β)), a = β/(α+β), b = α/(α+β); at C = 10^21 FLOPs the rounded Hoffmann Approach-3 parameters give N ≈ 1.82×10^9 and D ≈ 9.1×10^10 (≈50 tokens/parameter), while the Besiroglu refit gives N ≈ 2.78×10^9 and D ≈ 6.0×10^10 (≈22 tokens/parameter)."
    provenance: DERIVED
    domain: compute_optimal
    concepts: [compute_optimal_allocation, six_nd_rule, parametric_loss]
    confidence: high
    currentness_status: "REFERENCE / BASELINE"
    assumptions: ["C = 6ND exactly (no attention or embedding FLOPs).", "The parametric form holds at the target scale and data are unconstrained (single epoch).", "Parameter values are those in CLM-003 and CLM-005."]
    derivation: "Minimize E + A N^-α + B (C/6N)^-β over N: setting the derivative to zero gives αA N^-α = βB D^-β with D = C/(6N), which yields the stated G, a, b (Hoffmann et al. Eq. 4). Numerically, with α=0.34, β=0.28: a = 0.4516, G = (0.34·406.4/(0.28·410.7))^(1/0.62); C/6 = 1.667×10^20 gives N ≈ 1.82×10^9, D ≈ 9.14×10^10. With α=0.3478, β=0.3658, A=482.01, B=2085.43: a ≈ 0.5126, N ≈ 2.78×10^9, D ≈ 6.0×10^10. At C = 5.88×10^23 (6·70e9·1.4e12) the two fits give ≈32.5B/3.0T and ≈73B/1.34T respectively."
    limitations: ["The difference between the two parameter sets is a fit-procedure effect, not new data.", "Inference demand and data limits change the optimum (CLM-009, CLM-010)."]
    applicability: "Compute budget planning in Lesson 25.1 and Mastery Deliverable 1."
    related_claims: [CLM-003, CLM-005]
    curriculum_usage: { lessons: ["25.1"], labs: ["LAB-A"], assessments: ["Mastery-25"] }
  - id: CLM-010
    claim: "Sardana et al. (Beyond Chinchilla-Optimal, ICML 2024) add inference cost (2N FLOPs per inference token) to the scaling objective and conclude that with reasonably large inference demand (~1B requests) models should be trained smaller and longer than Chinchilla-optimal; their example replaces a 30B-Chinchilla-quality model at 1.5B requests with a 16B model on 3.35T tokens for 17% lower cost, and they report loss had not plateaued at 10,000 tokens per parameter for a 150M model."
    provenance: VERIFIED_FACT
    domain: compute_optimal
    concepts: [inference_aware_scaling, compute_optimal_allocation]
    confidence: medium
    currentness_status: "CURRENT DEFAULT"
    evidence: [{ source_type: paper, tier: 1, title: "Beyond Chinchilla-Optimal: Accounting for Inference in Language Model Scaling Laws", authors: "Nikhil Sardana, Jacob Portes, Sasha Doubov, Jonathan Frankle", year: "2023", url: "https://arxiv.org/abs/2401.00448", section: "Abstract; Sections 2, 4, 6 (HTML render, v3)", accessed_at: "2026-10-12" }]
    limitations: ["Cost model and request-length assumptions are the paper's; the 17% figure is one worked case.", "CURRENT DEFAULT here means the decision framing (train past compute-optimal when inference dominates), not a specific token ratio."]
    applicability: "Total-cost model allocation in Lesson 25.1 and the Mastery problem."
