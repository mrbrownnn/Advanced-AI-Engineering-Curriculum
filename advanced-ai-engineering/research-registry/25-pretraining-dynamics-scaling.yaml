    claim: "Pearce and Song (Reconciling Kaplan and Chinchilla Scaling Laws, TMLR 2024) attribute much of the discrepancy to Kaplan counting non-embedding rather than total parameters combined with small-scale analysis; simulating the Chinchilla study under those conditions yields a local coefficient of 0.74-0.78, close to Kaplan's 0.73, and they recommend using total parameters and compute."
