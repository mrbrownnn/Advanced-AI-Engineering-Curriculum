  - id: CLM-007
    claim: "Porian et al. (Resolving Discrepancies in Compute-Optimal Scaling of Language Models, NeurIPS 2024) identify last-layer computational cost, warmup duration, and scale-dependent optimizer tuning as the factors behind the Kaplan/Chinchilla difference; correcting them in sequence moved their fitted exponent from about 0.86 to about 0.50-0.52, they report that careful learning-rate decay was not essential, and that AdamW β2 = 0.95 is suboptimal at batch sizes of 128 and below."
