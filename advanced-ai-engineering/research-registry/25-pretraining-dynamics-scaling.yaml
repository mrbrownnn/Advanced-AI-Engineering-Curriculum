    claim: "Besiroglu et al. (Chinchilla Scaling: A replication attempt, 2024) reconstruct Hoffmann et al.'s Approach 3 data and report that the original fit was affected by rounded parameters, averaging rather than summing the Huber loss, and early optimizer termination; their refit gives E = 1.8172, A = 482.01, B = 2085.43, α = 0.3478, β = 0.3658 (a ≈ 0.51), consistent with about 20 tokens per parameter, and they report the original confidence intervals are implausibly narrow (would require over 600,000 experiments versus likely fewer than 500)."
