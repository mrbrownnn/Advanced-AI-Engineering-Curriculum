module: "25-pretraining-dynamics-scaling"
registry_version: "1.0.0"
research_cutoff: "2026-09-30"
change_reason: "Initial evidence registry for Module 25 (Pretraining Dynamics & Scaling): compute-optimal allocation and the Kaplan/Chinchilla disagreement, scaling-law fitting and failure (extrapolation, data repetition, downstream unpredictability), muP and hyperparameter transfer, training instabilities (attention-logit growth, output-logit divergence, loss spikes) and their mitigations, cosine versus warmup-stable-decay schedules, data-mixture optimization, and checkpoint averaging. Sources opened on 2026-10-12; abstract-only or HTML-render inspection is marked per claim."
out_of_scope_candidates:
  - "ZeRO/FSDP sharding, pipeline/tensor/context parallelism for training, FP8/MX training recipes (Module 26)."
  - "Fine-tuning, LoRA, preference optimization (Module 19); RL post-training systems (Module 27)."
  - "Data lineage, deduplication, and contamination mechanics (Module 08)."
  - "MoE router stability and router z-loss (Module 28)."
  - "u-muP (arXiv:2407.17465) was not verified in this pass."
claims:
  # ---------------- Lesson 25.1: compute accounting and compute-optimal allocation ----------------
  - id: CLM-001
    claim: "Kaplan et al. (2020) define N as model parameters excluding vocabulary and positional embeddings, estimate non-embedding training compute as C ≈ 6N FLOPs per training token (C ≈ 6NBS over B·S tokens), and report power laws L(N)=(N_c/N)^α_N with α_N ≈ 0.076, L(D)=(D_c/D)^α_D with α_D ≈ 0.095, and L(C_min)=(C_c^min/C_min)^α_C^min with α_C^min ≈ 0.050."
    provenance: VERIFIED_FACT
    domain: scaling_laws
    concepts: [six_nd_rule, power_law, non_embedding_params]
    confidence: high
    currentness_status: "REFERENCE / BASELINE"
    evidence: [{ source_type: paper, tier: 1, title: "Scaling Laws for Neural Language Models", authors: "Jared Kaplan, Sam McCandlish, Tom Henighan, Tom B. Brown, Benjamin Chess, Rewon Child, Scott Gray, Alec Radford, Jeffrey Wu, Dario Amodei", year: "2020", url: "https://arxiv.org/abs/2001.08361", section: "Section 1.2 (Eqs. 1.1-1.3); Section 1.3; Section 2.1; Appendix A Table 4 (full text, v1)", accessed_at: "2026-10-12" }]
    limitations: ["Exponents are fits to the paper's WebText2 models, tokenizer, architecture, and schedule; they are not constants of nature.", "6N omits the context-dependent attention term and counts only non-embedding compute."]
    applicability: "Compute accounting and the historical baseline for scaling-law forms."
    curriculum_usage: { lessons: ["25.1", "25.2"], labs: ["LAB-A"], assessments: ["Mastery-25"] }
  - id: CLM-002
    claim: "Kaplan et al. report that compute-efficient training uses very large models stopped significantly short of convergence, with optimal model size growing as N(C_min) ∝ C_min^0.73 and data as D ∝ C^0.27, and that all their models were trained for a fixed 2.5×10^5 steps with a 3,000-step linear warmup followed by cosine decay to zero."
    provenance: VERIFIED_FACT
    domain: compute_optimal
    concepts: [compute_optimal_allocation, lr_schedule]
    confidence: high
    currentness_status: "LEGACY"
    evidence: [{ source_type: paper, tier: 1, title: "Scaling Laws for Neural Language Models", authors: "Jared Kaplan, Sam McCandlish, Tom Henighan, et al.", year: "2020", url: "https://arxiv.org/abs/2001.08361", section: "Section 1.1; Section 2.2; Section 6.1 Eq. 6.1; Table 5 (full text)", accessed_at: "2026-10-12" }]
    limitations: ["Superseded as an allocation rule by CLM-003 and the reconciliations in CLM-006 and CLM-007; kept as the canonical counterexample of a confounded scaling fit."]
    applicability: "Explaining the Kaplan/Chinchilla disagreement."
    related_claims: [CLM-003, CLM-004, CLM-006, CLM-007]
    curriculum_usage: { lessons: ["25.1"], labs: ["LAB-A"], assessments: ["Mastery-25"] }
  - id: CLM-003
    claim: "Hoffmann et al. (Chinchilla, 2022) fit N_opt ∝ C^a and D_opt ∝ C^b with three approaches, reporting a = 0.50, 0.49, and 0.46 and b = 0.50, 0.51, and 0.54 (Table 2), versus Kaplan's 0.73/0.27; Approach 3 fits L(N,D) = E + A/N^α + B/D^β with E = 1.69, A = 406.4, B = 410.7, α = 0.34, β = 0.28 under FLOPs ≈ 6ND; Chinchilla (70B parameters, 1.4T tokens) was trained with the same FLOPs as Gopher."
