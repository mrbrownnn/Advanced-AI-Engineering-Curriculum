  - id: CLM-004
    claim: "Hoffmann et al. attribute part of the disagreement with Kaplan to Kaplan using a fixed number of training tokens and learning-rate schedule for all models, state that matching the cosine schedule length to the number of training tokens gives the best final loss regardless of model size, and report that a cosine cycle overshooting the number of training steps by more than 25% noticeably degrades performance."
