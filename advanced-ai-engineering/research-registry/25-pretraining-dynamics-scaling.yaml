    evidence: [{ source_type: paper, tier: 1, title: "Training Compute-Optimal Large Language Models", authors: "Jordan Hoffmann, Sebastian Borgeaud, Arthur Mensch, Elena Buchatskaya, Trevor Cai, Eliza Rutherford, et al.", year: "2022", url: "https://arxiv.org/abs/2203.15556", section: "Section 3 (Eqs. 2-4); Table 2; Section 4; Appendix D.2 Eq. 10 (full text, v1)", accessed_at: "2026-10-12" }]
