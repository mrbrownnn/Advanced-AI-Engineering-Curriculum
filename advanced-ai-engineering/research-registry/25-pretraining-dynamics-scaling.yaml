  - id: CLM-013
    claim: "Fitting a pure power law L = kN^-p (no irreducible term) to small-scale losses that follow L = E + A/N^α can fit the fitted range closely yet systematically under-predict loss at larger N; with synthetic truth L = 1.8 + 400/N^0.34 over N = 10^7-1.6×10^8, the pure power-law fit has maximum in-range relative residual ≈1.3% but under-predicts by ≈10.5% at N = 10^9 and ≈26.4% at N = 10^10, while fixing E wrong by ±0.1 gives ≈∓2.6-2.9% error at 10^10."
    provenance: DERIVED
    domain: scaling_law_fitting
    concepts: [extrapolation_error, irreducible_loss, power_law]
    confidence: high
    currentness_status: "REFERENCE / BASELINE"
    assumptions: ["Synthetic noiseless losses; data not limiting.", "Least-squares fit in log-log space over five points at N = 1, 2, 4, 8, 16 × 10^7."]
    derivation: "log L of E + A N^-α is concave in log N, so a straight line fit in log-log space over a short range has a too-steep effective slope (fitted p ≈ 0.125 vs. true local slope decreasing with N) and extrapolates below the asymptote E. Values computed with numpy.polyfit: fitted k ≈ 25.76, p ≈ 0.1252; predictions 1.923 vs. true 2.148 at 10^9 and 1.441 vs. 1.959 at 10^10. With E fixed at 1.7 or 1.9 and A, α refit, predictions at 10^10 are 1.907 and 2.016."
    limitations: ["Synthetic; real fits also face seed noise (CLM-011) and confounds (CLM-004, CLM-007)."]
    applicability: "Lesson 25.2 worked example and LAB A break condition."
    related_claims: [CLM-001, CLM-011]
    curriculum_usage: { lessons: ["25.2"], labs: ["LAB-A"], assessments: ["Mastery-25"] }
  - id: CLM-014
    claim: "A scaling law fitted on at least five proxy runs whose schedules are matched to each run's token budget, using total-parameter accounting, will predict the final validation loss of a held-out run at 4-10× the largest proxy compute within a pre-declared tolerance; the prediction becomes invalid when the target changes data mixture, tokenizer, parametrization, schedule family, or crosses into the repeated-data regime."
    provenance: HYPOTHESIS
    domain: scaling_law_fitting
    concepts: [extrapolation_error, proxy_validity]
    confidence: medium
    currentness_status: "WORKLOAD-DEPENDENT"
    hypothesis:
      prediction: "|L_pred − L_obs|/L_obs is within the declared tolerance (e.g., 2-4%) at the held-out scale when all listed invariants are held; it exceeds the tolerance when one invariant (e.g., schedule length or mixture) is changed between proxies and target."
      measurement_target: "Final validation loss of held-out runs (≥3 seeds at the largest proxy to estimate seed spread), fitted parameters with bootstrap intervals, and the prediction interval at target compute."
      falsifying_observation: "With invariants held, the held-out loss falls outside the bootstrap prediction interval widened by seed spread; or changing an invariant does not move the error beyond tolerance."
    limitations: ["Tolerances depend on seed variance at the proxy scale (CLM-011)."]
    applicability: "LAB A pre-registered hypothesis and Mastery Deliverable 2."
    related_claims: [CLM-011, CLM-013]
    curriculum_usage: { lessons: ["25.2"], labs: ["LAB-A"], assessments: ["Mastery-25", "Incident-25.1"] }
  # ---------------- Lesson 25.3: parametrization and HP transfer ----------------
  - id: CLM-015
    claim: "Yang et al. (Tensor Programs V, 2022) report that under the Maximal Update Parametrization (muP) the optimal learning rate is stable with width while under standard parametrization it is not; they transfer hyperparameters from a 13M-parameter proxy to outperform published BERT-large (350M) numbers at a tuning cost equivalent to one BERT-large pretraining, and from a 40M proxy (width 256) to outperform published 6.7B GPT-3 numbers at a tuning cost of 7% of pretraining; optimization-related HPs, initialization, and multipliers transfer, regularization HPs such as dropout and weight decay are listed as not transferring."
    provenance: VERIFIED_FACT
    domain: parametrization
    concepts: [mup, standard_parametrization, hp_transfer]
    confidence: high
    currentness_status: "CURRENT DEFAULT"
    evidence: [{ source_type: paper, tier: 1, title: "Tensor Programs V: Tuning Large Neural Networks via Zero-Shot Hyperparameter Transfer", authors: "Greg Yang, Edward J. Hu, Igor Babuschkin, Szymon Sidor, Xiaodong Liu, David Farhi, et al.", year: "2022", url: "https://arxiv.org/abs/2203.03466", section: "Abstract; Section 1 Fig. 1; Table 1; Section 7.4; Appendix E.1 (full text)", accessed_at: "2026-10-12" }]
    limitations: ["Transfer across depth, batch size, training time, and sequence length was 'empirically validated only on Transformers' (Table 1 footnote).", "CURRENT DEFAULT is scoped to width-wise HP transfer as a practice; adoption by any particular lab is not claimed."]
    applicability: "Width-wise learning-rate transfer from proxy models."
    related_claims: [CLM-016, CLM-017, CLM-018]
    curriculum_usage: { lessons: ["25.3"], labs: ["LAB-B"], assessments: ["Mastery-25"] }
