  # ---------------- Lesson 25.2: fitting and failure ----------------
  - id: CLM-009
    claim: "Muennighoff et al. (Scaling Data-Constrained Language Models, NeurIPS 2023) report that up to 4 epochs of repeated data yields negligible change in loss versus unique data and that with more repetition the value of added compute decays toward zero; they model effective data as D' = U_D + U_D·R*_D·(1 − e^(−R_D/R*_D)) (and similarly N'), inserted into the Chinchilla form, with fitted R*_D ≈ 15.39 (about 16 epochs) beyond which returns diminish extremely fast."
    provenance: VERIFIED_FACT
    domain: scaling_law_fitting
    concepts: [data_constrained_scaling, repetition, effective_data]
    confidence: high
    currentness_status: "CURRENT DEFAULT"
    evidence: [{ source_type: paper, tier: 1, title: "Scaling Data-Constrained Language Models", authors: "Niklas Muennighoff, Alexander M. Rush, Boaz Barak, Teven Le Scao, Aleksandra Piktus, Nouamane Tazi, Sampo Pyysalo, Thomas Wolf, Colin Raffel", year: "2023", url: "https://arxiv.org/abs/2305.16264", section: "Abstract; Section 3 Eqs. 5-6; Section 6; Appendix A (R*_D = 15.387756) (full text, v4 PDF)", accessed_at: "2026-10-12" }]
    limitations: ["R*_D is a decay constant (value lost to 1/e), not the point where repeated data becomes worthless.", "Fitted on the paper's data and model range; filtering and data quality change repetition value."]
    applicability: "Planning when unique tokens are fewer than the compute-optimal D."
    related_claims: [CLM-003, CLM-008]
    curriculum_usage: { lessons: ["25.2"], labs: ["LAB-A"], assessments: ["Mastery-25"] }
