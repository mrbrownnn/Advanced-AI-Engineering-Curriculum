  - id: CLM-015
    claim: "Removing either untrusted-content ingestion, access to sensitive data, or an exfiltration-capable sink from an agent's reachable graph will eliminate a larger share of successful injection-driven exfiltration than adding another detector layer, at comparable utility cost."
