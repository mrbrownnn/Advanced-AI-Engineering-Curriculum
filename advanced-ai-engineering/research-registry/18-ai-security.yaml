  - id: CLM-032
    claim: "For tool-metadata, tool-selection, memory, and visual injection channels, authority can be removed from the model by checks that read only authenticated principal, task capability, reviewed tool manifests pinned by content hash, and recorded write or observation provenance; under those assumptions a manipulated model cannot dispatch a call outside capability, or with an argument derived from an untrusted source, without confirmation."
    provenance: DERIVED
    domain: agent_channel_controls
    concepts: [manifest_pinning, memory_provenance, capability_scope, argument_taint]
    confidence: medium
    currentness_status: "RECOMMENDED ENGINEERING BASELINE"
    assumptions: ["The gateway, manifest store, and provenance labels are outside the model and cannot be written by untrusted text.", "Every tool call, every memory read used for an argument, and every OS action passes through the gateway.", "Tool review and provenance labelling are correct."]
    derivation: "Each attack in CLM-023 to CLM-028 places attacker text where the model treats it as configuration, past experience, or screen content, then relies on the model to choose a privileged action. If the dispatch decision depends only on inputs the attacker cannot write, the model's choice cannot exceed the granted capability; argument provenance blocks attacker-chosen values; a pinned manifest makes a post-review change visible."
    limitations: ["Does not cover a malicious tool that passed review, actions inside the granted capability, mislabelled provenance, tasks that need untrusted data to choose the action, or text-only harms; untested in this module."]
    applicability: "Tool-using, memory-augmented, and computer-use agents."
    curriculum_usage: { lessons: ["18.4"], labs: ["LAB-D"], assessments: ["Mastery-18"] }
