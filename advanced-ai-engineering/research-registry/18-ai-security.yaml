    curriculum_usage: { lessons: ["18.4", "18.6"], labs: ["LAB-D"], assessments: ["Mastery-18"] }
  - id: CLM-016
    claim: "For one poisoning trial, target match decomposes as P(T)=P(R)P(T|R)+P(not R)P(T|not R); target match without retrieval triggers alternate-path investigation rather than deletion, and causal adoption through retrieval requires controls and provenance."
    provenance: DERIVED
    domain: retrieval_poisoning_measurement
    concepts: [conditional_denominator, causal_adoption, provenance]
    confidence: high
    currentness_status: "RECOMMENDED EVALUATION BASELINE"
    assumptions: ["R records whether a poisoned passage was in delivered context and T records target-answer match on the same trial.", "No-poison and no-retrieval controls use matched queries and settings."]
    derivation: "Law of total probability partitions trials on R. T can occur through prior knowledge, cache, or another source when R is false, so R is not inferred from T. The no-poison contrast estimates attributable change; per-trial provenance identifies observed alternate paths."
    limitations: ["A control contrast does not identify individual causal effects without stronger design; clustered paraphrase/seed trials need cluster-aware uncertainty."]
    applicability: "RAG poisoning and any staged attack where upstream exposure and downstream outcome differ."
    curriculum_usage: { lessons: ["18.2"], labs: ["LAB-B"], assessments: ["Mastery-18"] }
  - id: CLM-017
    claim: "A cost ceiling is hard only when model calls, exact input tokens, server-capped output tokens, tool fan-out, physical retries, and unit prices have enforced maxima and every action reserves worst-case charge atomically before dispatch; security additionally keys the ledger by authenticated principal and limits that principal across episodes."
    provenance: DERIVED
    domain: consumption_control
    concepts: [budget_reservation, authenticated_principal, cross_episode_limit]
    confidence: high
    currentness_status: "RECOMMENDED ENGINEERING BASELINE"
    assumptions: ["Gateway obtains principal from authenticated session independently of model-controlled content.", "Every billed resource included in a hard cost claim has an enforceable pre-dispatch maximum."]
    derivation: "With maximum N calls, Tin/Tout tokens, fan-out F, inner retries ks, and capped unit costs, Cmax=N(Tin*p_in+Tout*p_out)+NF(1+ks)c_tool. The Module 12 invariant C+R<=B converts that bound into admission. Episode-only keying resets under repeated episodes, so all episodes of one authenticated principal share a second ledger."
    limitations: ["If any billed quantity lacks a cap, cost is an estimate; durability across crashes belongs to Module 14; time and side effects need separate controls."]
    applicability: "Agent loops exposed to attacker-controlled context or requests."
    curriculum_usage: { lessons: ["18.5"], labs: ["LAB-D"], assessments: ["Mastery-18"] }
  - id: CLM-018
    claim: "Egress control requires one proxy path that authorizes destination before lookup, validates resolved addresses, and reapplies policy to redirects; query stripping is only request shaping because data can move through path, subdomain, redirect, or an allowed host."
    provenance: DERIVED
    domain: egress_control
    concepts: [destination_policy, dns_resolution, redirect_policy]
    confidence: high
    currentness_status: "RECOMMENDED ENGINEERING BASELINE"
    assumptions: ["Renderer, fetch tools, and sandbox cannot bypass the proxy.", "Proxy connects only to the address that it validated."]
    derivation: "A network request reveals at least destination and timing even with no query. URL paths, host labels, and redirect targets carry data. Therefore policy must decide the destination and every redirect hop, while resolution checking prevents allowed names from reaching prohibited addresses."
    limitations: ["Allowed destinations still receive path data and traffic patterns; non-network sinks need their own gateway policies."]
    applicability: "Rendered remote content, URL fetchers, browsers, and code sandboxes."
    curriculum_usage: { lessons: ["18.5"], labs: ["LAB-D"], assessments: ["Mastery-18"] }
  - id: CLM-019
    claim: "A configuration Pareto-dominates another only if it is no worse on every declared security and utility metric; when points trade benign utility against ASR, selection requires an explicit utility floor or objective rather than a dominance claim."
    provenance: DERIVED
    domain: security_release_decision
    concepts: [pareto_frontier, utility_floor, aligned_protocol]
    confidence: high
    currentness_status: "RECOMMENDED EVALUATION BASELINE"
    assumptions: ["All rows use the same model, cases, denominator, and attack protocol for each metric."]
    derivation: "Pareto dominance is coordinatewise weak improvement plus one strict improvement. A lower benign-utility coordinate defeats dominance even when every attack metric improves. Predeclared floors and ceilings select among undominated trade-offs without changing the vector after seeing results."
    limitations: ["Point estimates need paired uncertainty before small differences drive release; stronger attacker budgets can move the frontier."]
    applicability: "Utility-aware release gates for security controls."
