  - id: "CLM-005"
    claim: "For independent observations from a normal population with unknown variance, the classical two-sided confidence interval for the population mean is xbar +/- t_(1-alpha/2,n-1)*s/sqrt(n); its confidence level describes long-run coverage of the procedure, not the posterior probability that this realized interval contains the parameter."
    provenance: "VERIFIED_FACT"
    domain: "statistical_inference"
    concepts: ["confidence_interval", "coverage", "standard_error", "t_interval"]
    confidence: "high"
    evidence:
      - source_type: "official_docs"
        tier: 2
        title: "NIST/SEMATECH Engineering Statistics Handbook: Confidence Limits for the Mean"
        authors: "NIST/SEMATECH"
        url: "https://www.itl.nist.gov/div898/handbook/eda/section3/eda352.htm"
        section: "Definition and interpretation"
        accessed_at: "2026-09-25"
    limitations:
      - "Autocorrelation, hierarchy, heavy tails, censoring, adaptive stopping, and selection can invalidate the simple interval."
      - "The formula is for a mean, not a percentile or a speedup ratio."
    applicability: "Mean latency, throughput, quality, or cost estimates when the sampling assumptions are defensible."
    curriculum_usage:
      lessons: ["0.5"]
      labs: ["LAB-C"]
      assessments: ["Mastery-00"]

  - id: "CLM-006"
    claim: "If independent normal observations have known standard deviation sigma, a normal-approximation mean interval with absolute half-width E requires n >= (z_(1-alpha/2)*sigma/E)^2; replacing sigma with a pilot estimate makes this a planning approximation rather than a guarantee."
    provenance: "DERIVED"
    domain: "statistical_inference"
    concepts: ["sample_size", "margin_of_error", "pilot_variance"]
    confidence: "high"
    assumptions:
      - "Independent observations with finite variance and a target population mean."
      - "Known sigma for the exact algebraic planning equation, or a representative pilot estimate for an approximation."
      - "Fixed sampling plan and absolute, not silently relative, margin E."
    derivation: "Set the normal-interval half-width z_(1-alpha/2)*sigma/sqrt(n) <= E, square both sides, and round n upward."
    limitations:
      - "Does not size experiments for P99, ratios, clustered samples, multiple comparisons, or a desired probability of detecting an effect."
    applicability: "Initial sizing of mean-estimation experiments followed by sequential uncertainty checks that were declared before measurement."
    curriculum_usage:
      lessons: ["0.5"]
      labs: ["LAB-C"]
      assessments: ["Mastery-00"]

  - id: "CLM-007"
    claim: "For n independent trials where an event has probability q, the probability of observing at least one event is 1-(1-q)^n; observing a rare tail event is not the same as estimating a tail quantile precisely."
    provenance: "DERIVED"
    domain: "tail_measurement"
    concepts: ["rare_event", "tail_latency", "percentile", "binomial_model"]
    confidence: "high"
    assumptions:
      - "Independent Bernoulli event indicators with constant probability q."
      - "No censoring, coordinated omission, or adaptive selection."
    derivation: "The probability of zero events in n independent trials is (1-q)^n, so the complement is 1-(1-q)^n. For q=0.01 and 95% observation probability, n >= ln(0.05)/ln(0.99), hence n=299 after rounding upward."
    limitations:
      - "This calculation only concerns seeing at least one event from a defined tail set; it is not a confidence interval for P99 and does not justify a quantile convention."
    applicability: "Sanity-checking whether a latency run is even long enough to expose rare events under a simplified independent model."
    curriculum_usage:
      lessons: ["0.4", "0.5"]
      labs: ["LAB-A", "LAB-C"]
      assessments: ["Mastery-00"]

  - id: "CLM-008"
    claim: "An extreme observation is not automatically erroneous: formal outlier procedures depend on distributional and multiplicity assumptions, and unexplained points should be investigated or handled with a predeclared robust analysis rather than deleted because they change the conclusion."
    provenance: "VERIFIED_FACT"
    domain: "data_analysis"
    concepts: ["outlier", "robust_statistics", "failure_signal", "analysis_policy"]
    confidence: "high"
    evidence:
      - source_type: "official_docs"
        tier: 2
        title: "NIST/SEMATECH Engineering Statistics Handbook: Detection of Outliers"
        authors: "NIST/SEMATECH"
        url: "https://www.itl.nist.gov/div898/handbook/eda/section3/eda35h.htm"
        section: "Outlier labeling, accommodation, identification, and normality assumption"
        accessed_at: "2026-09-25"
    limitations:
      - "Known harness corruption can justify exclusion when the rule and evidence are recorded; retain the raw data and report sensitivity with and without excluded observations."
    applicability: "Latency spikes, failed requests, profiler anomalies, and evaluation-score extremes."
    curriculum_usage:
      lessons: ["0.4", "0.7"]
      labs: ["LAB-A", "LAB-D"]
      assessments: ["Incident-00.1"]

