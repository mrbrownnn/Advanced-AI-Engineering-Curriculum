  - id: "CLM-013"
    claim: "Source observations, mathematical derivations, and engineering hypotheses carry different evidence burdens: an observed result is scoped to its setup, a derivation is conditional on assumptions, and a hypothesis requires a prediction plus a discriminating or falsifying measurement."
    provenance: "DERIVED"
    domain: "scientific_reasoning"
    concepts: ["source_observation", "derivation", "hypothesis", "falsification"]
    confidence: "high"
    assumptions:
      - "Claims are written atomically enough that their evidence and scope can be inspected."
      - "The experiment exposes measurements capable of distinguishing at least some competing explanations."
    derivation: "The three claim types answer different questions: what was reported, what follows logically from premises, and what causal explanation predicts new observations. Therefore one type cannot inherit the evidentiary status of another without an explicit bridge."
    limitations:
      - "Complex investigations may combine all three types; labels improve auditability but do not make weak evidence strong."
    applicability: "Every research registry, module claim, experiment report, and incident diagnosis."
    curriculum_usage:
      lessons: ["0.1", "0.7"]
      labs: ["LAB-A", "LAB-B", "LAB-C", "LAB-D"]
      assessments: ["Incident-00.1", "Mastery-00"]

