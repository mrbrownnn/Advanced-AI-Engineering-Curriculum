claims:
  - id: "CLM-001"
    claim: "A defensible measurement result requires a declared measurand, observation boundary, unit, procedure, and uncertainty; an instrument reading or dashboard number without those definitions is not a complete engineering claim."
    provenance: "VERIFIED_FACT"
    domain: "measurement"
    concepts: ["measurand", "measurement_boundary", "uncertainty", "traceability"]
    confidence: "high"
    evidence:
      - source_type: "specification"
        tier: 1
        title: "Metrological Traceability: Frequently Asked Questions and NIST Policy"
        authors: "National Institute of Standards and Technology"
        url: "https://www.nist.gov/metrology/metrological-traceability"
        section: "Sections 5.1.1 and 5.1.2"
        accessed_at: "2026-09-25"
    limitations:
      - "Software performance measurements are often relative rather than SI-traceable; the same discipline still applies to clocks, units, boundaries, and uncertainty."
    applicability: "All benchmark, evaluation, profiling, and incident measurements in the curriculum."
    curriculum_usage:
      lessons: ["0.1", "0.2"]
      labs: ["LAB-A", "LAB-D"]
      assessments: ["Mastery-00"]

  - id: "CLM-002"
    claim: "Seemingly irrelevant setup choices can change program layout and measured performance enough to reverse an experimental conclusion; setup randomization and causal follow-up are therefore controls against measurement bias, not cosmetic reporting choices."
    provenance: "VERIFIED_FACT"
    domain: "experimental_design"
    concepts: ["measurement_bias", "setup_randomization", "confounding"]
    confidence: "high"
    evidence:
      - source_type: "paper"
        tier: 1
        title: "Producing Wrong Data Without Doing Anything Obviously Wrong"
        authors: "Todd Mytkowicz, Amer Diwan, Matthias Hauswirth, Peter F. Sweeney"
        year: "2009"
        url: "https://research.ibm.com/publications/producing-wrong-data-without-doing-anything-obviously-wrong"
        section: "Abstract and Sections 2-5"
        accessed_at: "2026-09-25"
    limitations:
      - "The demonstrated mechanisms and effect sizes are platform-specific; the general lesson is to test setup sensitivity rather than assume the same bias on every system."
    applicability: "System benchmarks sensitive to binary layout, allocation, scheduling, caching, or environment state."
    curriculum_usage:
      lessons: ["0.2", "0.3"]
      labs: ["LAB-B"]
      assessments: ["Incident-00.1", "Mastery-00"]

  - id: "CLM-003"
    claim: "Randomized block designs compare treatments within levels of important nuisance factors, while randomization reduces systematic contamination from nuisance factors that are not controlled."
    provenance: "VERIFIED_FACT"
    domain: "experimental_design"
    concepts: ["randomization", "blocking", "nuisance_factor", "paired_design"]
    confidence: "high"
    evidence:
      - source_type: "official_docs"
        tier: 2
        title: "NIST/SEMATECH Engineering Statistics Handbook: Randomized Block Designs"
        authors: "NIST/SEMATECH"
        url: "https://www.itl.nist.gov/div898/handbook/pri/section3/pri332.htm"
        section: "Blocking and randomization; model for a randomized block design"
        accessed_at: "2026-09-25"
    limitations:
      - "Blocking only handles declared factors and does not repair carryover, interference between trials, or a changing treatment implementation."
    applicability: "A/B performance comparisons across machines, time windows, seeds, datasets, or workload strata."
    curriculum_usage:
