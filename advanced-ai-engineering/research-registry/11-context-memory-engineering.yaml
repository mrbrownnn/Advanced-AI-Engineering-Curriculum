  - id: CLM-017
    claim: "Context admission is a ledger that must reconcile: placed input tokens plus fixed output reserve plus the estimator margin plus unallocated tokens equals the limit; overflow is resolved by category caps applied from the lowest priority upward, dropping whole atomic groups (a tool call with its result, a whole evidence chunk), and never by reducing the output reserve."
    provenance: DERIVED
    domain: context_budget
    concepts: [token_ledger, atomic_group, output_reserve, overflow_policy]
    confidence: high
    currentness_status: "RECOMMENDED BASELINE"
    assumptions: ["The interface enforces one combined token limit for input and output.", "Each category is counted exactly or with an estimator whose worst-case under-count has been measured.", "The message protocol requires a tool result to follow the call that produced it."]
    derivation: "Fixture: limit 32,000; requested 36,580 (overflow 4,580). Caps reduce evidence 14,000 to 12,000 and history 11,500 to 7,900 by dropping groups of 400 and 3,200. Placed 30,980, slack 1,020; margin 5 percent of 12,000 heuristic-counted evidence tokens = 600; 31,580 <= 32,000, admit with 420 unallocated; 28,980 + 2,000 + 600 + 420 = 32,000. Dropping messages instead of groups under a 10,900 history cap removes a 300-token tool call and keeps its 2,900-token result, which orphans the result."
    limitations: ["Synthetic numbers.", "Fitting the limit says nothing about effective use of the context.", "Interfaces with separate input and output limits need two ledgers."]
    applicability: "Admission and truncation for chat, RAG, and agent requests."
    related_claims: ["CLM-001", "CLM-002"]
    curriculum_usage: { lessons: ["11.1"], labs: ["LAB-A"], assessments: ["Mastery-11", "Incident-11.1"] }

  - id: CLM-018
    claim: "Canonical memory converges under concurrent corrections, redelivery, and deletion when each write carries an operation ID and the base version it read, and the store atomically returns the stored outcome for a known operation ID, accepts when the base equals the stored version, and rejects otherwise; a delete is a versioned tombstone that is collected only after every index, replica, and cache has converged and the redelivery window has passed."
    provenance: DERIVED
    domain: memory_lifecycle
    concepts: [conditional_write, tombstone, lost_update, memory_versioning]
    confidence: high
    currentness_status: "RECOMMENDED BASELINE"
    assumptions: ["More than one writer can update a key, and writes can be delayed or redelivered.", "The store supports an atomic compare-and-write per key.", "Read paths can check a selected hit against canonical state."]
    derivation: "Trace from stored version 4: A writes with base 4 (ACCEPT, version 5); B writes with base 4 (REJECT stale, no lost update); A retry with the same operation ID (DUPLICATE); user delete with base 5 (ACCEPT, tombstone version 6); a summarizer write with base 5 (REJECT stale, so the deleted value is not restored); a late redelivery of A (DUPLICATE, or REJECT stale if the operation ID has expired); a stale index hit is excluded by the validity check. Under unconditional last-writer-wins the second correction overwrites the first and the summarizer write restores the deleted record. If the tombstone is collected early, a write with no base is accepted as a new record."
    limitations: ["Which value should win a conflict is a product decision.", "A design walk-through, not an executed test.", "Module 10 Lesson 10.2 states the related rule for index events ordered by source version; Module 14 Lesson 14.2 covers external effects."]
    applicability: "Preferences, decisions, and other canonical state with multiple writers."
    related_claims: ["CLM-008", "CLM-009"]
    curriculum_usage: { lessons: ["11.3", "11.4"], labs: ["LAB-C"], assessments: ["Mastery-11", "Incident-11.1"] }

  - id: CLM-019
    claim: "When each stage count is a subset of the previous one on the same probe cohort, the product of the conditional stage rates equals used/probes exactly; it equals the end-to-end success rate only if no success bypasses the chain, and substituting a rate with a different denominator (such as selection precision) makes the product meaningless."
    provenance: DERIVED
    domain: memory_evaluation
    concepts: [conditional_rate, stage_attribution, end_to_end_rate]
    confidence: high
    currentness_status: "EXACT ARITHMETIC FOR A DECLARED COHORT"
    assumptions: ["One probe cohort with nested stage sets: stored, valid, selected, placed, used.", "Each probe needs exactly one identified record."]
    derivation: "Cohort 200: stored 180, valid 162, selected 130, placed 117, used 94. Rates 0.900, 0.900, 0.802, 0.900, 0.803 multiply to 94/200 = 0.47 because the product telescopes. If 6 probes that failed in the chain are still answered correctly, end-to-end correctness is 100/200 = 0.50. Replacing selected-given-valid (130/162) with selection precision (130/150) gives 0.508, which corresponds to no observed quantity. An oracle-selection replay with 146 placed and 117 used gives a chain rate of 0.585."
    limitations: ["Synthetic counts without uncertainty.", "Probes that need several records require a different unit.", "Attribution of bypass successes needs a memory-disabled replay."]
    applicability: "Memory regression analysis and incident diagnosis."
    related_claims: ["CLM-015"]
    curriculum_usage: { lessons: ["11.6"], labs: ["LAB-D"], assessments: ["Mastery-11", "Incident-11.1"] }

