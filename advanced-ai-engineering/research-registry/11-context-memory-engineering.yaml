claims:
  - id: CLM-001
    claim: "A model context window is a finite per-inference input/output token capacity, not durable memory; instructions, message framing, tool schemas/results, retrieved material, working state, and output reserve all compete for that capacity."
    provenance: DERIVED
    domain: context_budget
    concepts: [context_window, token_budget, output_reserve]
    confidence: high
    currentness_status: "CURRENT DEFAULT"
    assumptions: ["The serving interface enforces a finite model-specific sequence limit and serializes all relevant prompt elements into model input."]
    derivation: "For a declared tokenizer/protocol, sum(system, tools, history, retrieved/context, state, current input, framing, reserved output) must not exceed the supported request limit. Persisted data outside the request is unavailable unless selected back into context."
    limitations: ["Providers may expose separate or combined input/output limits and hidden framing; exact accounting is interface-specific."]
    applicability: "Every chat, RAG, or agent request with finite context."
    curriculum_usage: { lessons: ["11.1"], labs: ["LAB-A"], assessments: ["Mastery-11"] }

  - id: CLM-002
    claim: "Token counts are tokenizer-, model-, role-, tool-schema-, modality-, and message-protocol-dependent; character or word heuristics are approximations and require measured safety margin."
    provenance: DERIVED
    domain: context_budget
    concepts: [tokenization, protocol_overhead, safety_margin]
    confidence: high
    currentness_status: "CURRENT DEFAULT"
    assumptions: ["Different request components may be serialized with hidden or explicit delimiters and multimodal accounting."]
    derivation: "The model consumes serialized tokens rather than human-visible words. Any estimator omitting tokenizer or framing inputs can under- or over-count, so exact admission uses the target interface when available and approximation error is measured."
    limitations: ["Exact server-side framing may be unavailable; safety margin must be calibrated per interface version.", "Module 01 teaches that the model consumes token IDs from one fixed tokenizer but not how tokenizers split text; the counting facts are taught in Lesson 11.1."]
    applicability: "Admission, truncation, compaction, and output-reserve decisions."
    curriculum_usage: { lessons: ["11.1"], labs: ["LAB-A"], assessments: ["Incident-11.1"] }

