    derivation: "Searching many metrics or slices raises false-discovery probability, while aggregation allows gains to compensate for critical harms. Predeclared constraints and uncertainty make the decision rule auditable."
    limitations: ["Thresholds encode value and risk judgments; statistics cannot choose them automatically."]
    applicability: "Model, prompt, retrieval, tool, policy, and runtime releases."
