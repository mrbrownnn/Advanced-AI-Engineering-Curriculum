  - id: CLM-024
    claim: "In one seeded synthetic model with within-block correlation 0.5 and four rows per block, nominal 95% intervals covered the true mean in 0.756 (row bootstrap), 0.900 (block percentile bootstrap), and 0.953 (block t) of replications at 10 blocks, and in 0.774, 0.931, and 0.946 at 40 blocks."
    provenance: DERIVED
    domain: statistics
    concepts: [interval_coverage, block_resampling, bootstrap]
    confidence: medium
    currentness_status: "WORKLOAD-DEPENDENT / SIMULATION"
    assumptions: ["Block effects are Normal(0.25, 0.4^2) and row noise is Normal(0, 0.4^2), independent across blocks.", "Percentile intervals use 1,000 resamples; 5,000 replications; NumPy default_rng seed 151."]
    derivation: "Monte Carlo: for each replication draw the data, form each interval, and record whether it contains 0.25. The row bootstrap ignores the between-block variance component, so its interval is too narrow for any number of blocks. The percentile block bootstrap uses the right unit but its distribution is too narrow by the factor sqrt((G-1)/G) and uses normal-like quantiles, so it undercovers when G is small. The t interval is exact for normal block effects by construction."
    numeric_metadata:
      numeric_type: predicted_behavior
      workload: "Synthetic two-level normal model; G in {10, 40}; m=4."
      metric_definition: "Fraction of nominal 95% intervals containing the true mean."
      measurement_method: "Seeded Monte Carlo; standard error about 0.003 near 0.95 and 0.006 near 0.76."
    limitations: ["One simulation model; coverage for skewed, bounded, or heavy-tailed block effects can differ in either direction.", "Not a measurement of any real evaluation.", "Does not rank bootstrap variants that were not run."]
    applicability: "Illustrating that the resampling unit matters and that a small-sample bootstrap interval is an approximation."
    related_claims: ["CLM-020"]
    curriculum_usage: { lessons: ["15.4"], labs: ["LAB-C"], assessments: ["Mastery-15"] }
