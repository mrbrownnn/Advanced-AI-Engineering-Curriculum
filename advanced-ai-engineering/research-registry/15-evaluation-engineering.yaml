  - id: CLM-019
    claim: "A slice-weighted estimate sum_s w_s m_s equals the target population mean only when the slices partition the population (disjoint and exhaustive) and the weights are the target prevalences summing to one; with overlapping tags, items must instead be weighted individually by target cell share over sample cell share, so that each item is counted once."
    provenance: DERIVED
    domain: dataset_design
    concepts: [slice_partition, post_stratification, item_weighting]
    confidence: high
    currentness_status: "RECOMMENDED BASELINE / MODULE DERIVATION"
    assumptions: ["Target cell shares are known.", "Every target cell with nonzero share has sampled items.", "Within a cell, sampled items represent that cell's population."]
    derivation: "For a partition, the law of total probability gives E[m] = sum_s P(S_s) E[m | S_s]. If an item lies in two slices its score enters two terms; if it lies in none it enters no term, so the identity fails. Weighting item i by (target share of its cell)/(sample share of its cell) and normalizing by the weight sum reproduces the partition formula over cells, because all items in a cell share one weight. Worked check: cells (10,9), (4,3), (2,1), (4,1) as (items, passes) give 14/20 = 0.70; overlapping tag slices give 0.75 with weights summing to 1.2, or 0.625 after normalizing."
    limitations: ["An empty sampled cell cannot be reweighted.", "Extreme weights inflate variance.", "The worked numbers are synthetic."]
    applicability: "Prevalence-weighted reporting over tagged evaluation sets."
    related_claims: ["CLM-004", "CLM-011"]
    curriculum_usage: { lessons: ["15.2"], labs: ["LAB-A"], assessments: ["Mastery-15"] }
  - id: CLM-020
    claim: "When an independent unit contributes more than one row, the interval for a paired mean must be built from block effects (a t interval on block means or a bootstrap that resamples whole blocks); resampling rows understates the standard error by about the square root of the design effect 1+(m-1)rho under positive within-block correlation, and the bootstrap distribution of a mean of G block effects has standard deviation sqrt((G-1)/G) s_b/sqrt(G)."
    provenance: DERIVED
    domain: statistics
    concepts: [block_resampling, design_effect, paired_comparison]
    confidence: high
    currentness_status: "RECOMMENDED BASELINE / MODULE DERIVATION"
    assumptions: ["Blocks are sampled independently from the target population.", "For the design-effect expression: equal block size m, common row variance, and one common within-block correlation rho.", "For the t interval: block effects are approximately normal."]
    derivation: "With G independent blocks of m rows, Var(mean) = (1/(Gm)^2) * G * [m sigma^2 + m(m-1) rho sigma^2] = sigma^2 [1+(m-1) rho]/(Gm). Treating rows as independent drops the covariance term. Resampling G values with replacement from G block effects gives a mean whose variance is the population-style variance of those values divided by G, that is ((G-1)/G) s_b^2 / G. Worked check on the synthetic fixture R-15 (10 blocks of 4): block SE 0.1491 versus row SE 0.0930, ratio 1.60."
    limitations: ["With unequal block sizes the block-weighted and row-weighted means are different estimands.", "A percentile bootstrap over few blocks undercovers; see CLM-024.", "Negative within-block correlation makes the row interval wider, not narrower; the block level is still the correct unit."]
    applicability: "Repeated generations, multi-turn conversations, per-user task sets, shared documents, and translated question sets."
    related_claims: ["CLM-003", "CLM-010", "CLM-024"]
    curriculum_usage: { lessons: ["15.1", "15.4"], labs: ["LAB-C"], assessments: ["Mastery-15"] }
  - id: CLM-021
    claim: "A three-state release rule can be defined from predeclared gates on a two-sided 1-alpha interval [L,U] signed so larger is better: an improvement gate passes if L >= epsilon and is refuted if U < epsilon; a noninferiority gate passes if L >= -tau and is refuted if U < -tau; RELEASE requires every gate to pass, HOLD follows from any refuted gate or violated hard constraint, and everything else is INCONCLUSIVE. Requiring all gates to pass needs no multiplicity adjustment for false release; any-of-K claims and L planned looks use alpha/K and alpha/L."
    provenance: DERIVED
    domain: release_gating
    concepts: [regression_gate, noninferiority_margin, multiple_comparisons, decision_state]
    confidence: high
    currentness_status: "RECOMMENDED BASELINE / MODULE DERIVATION"
    assumptions: ["Each interval procedure has at least its nominal coverage for its own parameter.", "Thresholds, margins, slices, levels, and looks are fixed before results are seen.", "Looks are counted in advance."]
    derivation: "If the true value of gate j is at or below its threshold, the gate passes only when L_j exceeds the true value, which has probability at most alpha/2 for a two-sided 1-alpha interval. If release is false because some gate j is truly violated, P(all gates pass) <= P(gate j passes) <= alpha/2, so no adjustment is needed. If any one of K gates could justify a claim, the union bound gives at most K times the per-gate level, so testing each at alpha/K restores the level; the same bound covers L looks. With k independent attempts at a gate whose true value equals its threshold, P(at least one pass) = 1-(1-alpha/2)^k."
    limitations: ["Bonferroni is conservative; group-sequential boundaries are not covered.", "The all-must-pass rule lowers power.", "INCONCLUSIVE followed by risk acceptance is a governance decision, not a statistical pass.", "Coverage of the underlying interval is itself approximate; see CLM-024."]
    applicability: "Model, prompt, retrieval, tool, policy, and runtime releases; reused by Module 17."
    related_claims: ["CLM-011", "CLM-020", "CLM-022"]
    curriculum_usage: { lessons: ["15.4"], labs: ["LAB-C"], assessments: ["Mastery-15"] }
