  - id: CLM-009
    claim: "Recall@k, MRR, and nDCG@k answer different questions: set coverage, first-relevant rank, and graded discounted ranking; metric choice requires a query-level relevance and user-action contract."
    provenance: DERIVED
    domain: evaluation
    concepts: [recall_at_k, mrr, ndcg]
    confidence: high
    currentness_status: "REFERENCE / BASELINE"
    assumptions: ["Judgments, cutoff, gain, discount, and unjudged-document policy are declared.", "Module conventions: linear gain, log2(i+1) discount, unjudged documents scored as gain 0 and counted, zero-IDCG queries excluded from means and counted, system-score ties broken by ascending document ID."]
    derivation: "Recall@k divides retrieved relevant items by known relevant items; reciprocal rank uses the first relevant rank; nDCG normalizes discounted graded gain by the ideal ordering over all judged items. With no relevant judgment IDCG is 0 and nDCG is undefined, so the handling rule changes the mean: in the module example 0.494 with the query excluded versus 0.329 with it scored as 0."
    limitations: ["Incomplete judgments and pooled labels bias all three differently."]
    applicability: "Offline retrieval evaluation aligned to search and downstream consumption."
    curriculum_usage: { lessons: ["9.6"], labs: ["LAB-D"], assessments: ["Mastery-09"] }
  - id: CLM-010
    claim: "Retrieval latency must be decomposed into parsing/rewriting, embedding, lexical/vector candidate search, fusion, fetch, reranking, network, and queue time; an ANN microbenchmark does not establish end-to-end latency or goodput."
    provenance: DERIVED
    domain: performance
    concepts: [latency_budget, candidate_depth, goodput]
    confidence: high
    currentness_status: "CURRENT DEFAULT"
    assumptions: ["Stage timestamps share a defined clock boundary and parallel branches are represented by their dependency graph."]
    derivation: "Serial stage times add along the critical path; parallel branches contribute their join maximum plus shared/queue overhead, while total work controls capacity."
    limitations: ["Caching, batching, fanout, and contention change stage distributions."]
    applicability: "Capacity and quality-latency tuning for retrieval services."
    curriculum_usage: { lessons: ["9.6"], labs: ["LAB-B", "LAB-D"], assessments: ["Incident-09.1", "Mastery-09"] }
