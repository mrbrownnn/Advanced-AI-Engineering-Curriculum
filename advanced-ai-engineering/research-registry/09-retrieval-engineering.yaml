  - id: CLM-028
    claim: Candidate-softmax gradients, nominal shared-negative counts, independent false-negative probability, and
      teacher-margin invariances follow from the declared training model; worked-example inputs are synthetic.
    provenance: DERIVED
    domain: retrieval_adaptation
    concepts:
    - contrastive_loss
    - temperature
    - false_negatives
    - margin_mse
    confidence: high
    limitations:
    - Negative correlations invalidate the independent probability expression; valid distinct negatives can be fewer
      than nominal columns. Toy arithmetic does not predict quality.
    curriculum_usage:
      lessons:
      - '9.7'
      labs:
      - LAB-E
      assessments:
      - Mastery-09
    assumptions:
    - One positive/query; all WB(1+n) candidates shared without masking for the count; score scale 1/tau.
    - Independent Bernoulli false-negative probability f only for the toy probability model.
    - Student and teacher score differences compared on the same query/triple.
    derivation: For one query dL/dz_c=pi_c-indicator(c=positive), and dL/du adds 1/tau. N_neg=WB(1+n)-1. P(F>=1)=1-(1-f)^n
      and E[F]=nf. Per-query additive teacher constants cancel but scaling does not. Synthetic scores 0.7/0.5/0.3/0.6
      at scale20 yield loss0.1432; scale1 gives1.2220; scale50 gives0.0068; removing0.6 at scale20 gives0.0185. W4
      B32 n3 gives511 negatives,384 explicit. f0.1 n4 gives0.3439. Margins4 versus0.5 give12.25; target0.2 gives0.09.
      Strict0.95*0.70 threshold0.665 retains0.66/0.60/0.41. All arithmetic recomputed in Python.
