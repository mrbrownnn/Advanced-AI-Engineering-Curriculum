claims:
  - id: CLM-001
    claim: "BM25 combines inverse document frequency, saturating term frequency, and document-length normalization; tokenization, field statistics, k1, b, corpus, and query terms are part of its behavior, so it is not a parameter-free lexical baseline."
    provenance: VERIFIED_FACT
    domain: lexical_retrieval
    concepts: [bm25, idf, length_normalization]
    confidence: high
    currentness_status: "REFERENCE / CURRENT DEFAULT"
    evidence: [{ source_type: paper, tier: 1, title: "The Probabilistic Relevance Framework: BM25 and Beyond", authors: "Stephen Robertson, Hugo Zaragoza", year: "2009", url: "https://www.staff.city.ac.uk/~sbrp622/papers/foundations_bm25_review.pdf", section: "BM25 derivation and variables", accessed_at: "2026-09" }]
    limitations: ["Exact scoring variants and analyzer behavior differ among engines."]
    applicability: "Lexical candidate generation, exact identifiers, rare terms, and strong baseline comparisons."
    curriculum_usage: { lessons: ["9.1"], labs: ["LAB-A"], assessments: ["Mastery-09"] }
  - id: CLM-002
    claim: "Dense Passage Retrieval uses separately encoded queries and passages with inner-product search and reports gains over its BM25 baseline on evaluated open-domain QA datasets; those gains do not establish dense retrieval dominance across domains or shifts."
    provenance: VERIFIED_FACT
    domain: dense_retrieval
    concepts: [dual_encoder, embeddings, inner_product]
    confidence: high
    currentness_status: "REFERENCE / WORKLOAD-DEPENDENT"
    evidence: [{ source_type: paper, tier: 1, title: "Dense Passage Retrieval for Open-Domain Question Answering", authors: "Vladimir Karpukhin, Barlas Oğuz, Sewon Min, Patrick Lewis, Ledell Wu, Sergey Edunov, Danqi Chen, Wen-tau Yih", year: "2020", url: "https://arxiv.org/abs/2004.04906", section: "Method and experiments", accessed_at: "2026-09" }]
    limitations: ["Training negatives, encoder revision, corpus, chunking, metric, and benchmark determine transfer."]
    applicability: "Semantic candidate retrieval where a representative relevance-training signal exists."
    curriculum_usage: { lessons: ["9.2"], labs: ["LAB-A"], assessments: ["Mastery-09"] }
  - id: CLM-003
    claim: "HNSW organizes an approximate-nearest-neighbor graph into randomized hierarchical layers and exposes search/build trade-offs; its recall, latency, memory, and update behavior depend on data geometry, distance, construction/search parameters, filters, and implementation."
    provenance: VERIFIED_FACT
    domain: ann
    concepts: [hnsw, graph_search, approximate_recall]
    confidence: high
    currentness_status: "CURRENT DEFAULT / WORKLOAD-DEPENDENT"
    evidence: [{ source_type: paper, tier: 1, title: "Efficient and robust approximate nearest neighbor search using Hierarchical Navigable Small World graphs", authors: "Yu. A. Malkov, D. A. Yashunin", year: "2018", url: "https://arxiv.org/abs/1603.09320", section: "Algorithm and experiments", accessed_at: "2026-09" }]
    limitations: ["Paper complexity and benchmarks do not predict a filtered, mutable production index universally."]
    applicability: "High-recall approximate vector candidate generation when memory/build cost is acceptable."
    curriculum_usage: { lessons: ["9.3"], labs: ["LAB-B"], assessments: ["Mastery-09"] }
  - id: CLM-004
    claim: "ANN recall@k is the fraction of exact top-k neighbors recovered under the same vectors, distance, filters, and snapshot; it measures approximation error, not semantic relevance or downstream answer quality."
    provenance: DERIVED
    domain: ann_metrics
    concepts: [ann_recall, exact_knn, metric_boundary]
    confidence: high
    currentness_status: "REFERENCE / BASELINE"
    assumptions: ["Exact and approximate searches use identical indexed items, vector values, similarity definition, filter, and tie policy."]
    derivation: "ANN recall@k=|A_k intersection E_k|/|E_k| compares approximate set A_k to exact set E_k; relevance labels do not appear in this definition."
    limitations: ["Ties and approximate exact baselines require explicit handling."]
    applicability: "Separating index approximation loss from encoder/relevance loss."
    curriculum_usage: { lessons: ["9.3", "9.6"], labs: ["LAB-B"], assessments: ["Mastery-09"] }
  - id: CLM-005
    claim: "Reciprocal rank fusion scores a document as the sum over input rankings of 1/(k + rank) and therefore avoids direct score-scale comparability; the original paper uses unweighted full permutations with k=60 fixed in a pilot study, so weights, truncated-list missing-item policy, list depth, and duplicate identity are engineering extensions that must be declared."
    provenance: VERIFIED_FACT
    domain: hybrid_retrieval
    concepts: [rrf, rank_fusion, lexical_dense]
    confidence: high
    currentness_status: "REFERENCE / CURRENT DEFAULT"
    evidence: [{ source_type: paper, tier: 1, title: "Reciprocal Rank Fusion Outperforms Condorcet and Individual Rank Learning Methods", authors: "Gordon V. Cormack, Charles L. A. Clarke, Stefan Büttcher", year: "2009", url: "https://dl.acm.org/doi/10.1145/1571941.1572114", section: "Section 1, RRFscore formula and k=60 (author-hosted copy at https://plg.uwaterloo.ca/~gvcormac/cormacksigir09-rrf.pdf)", accessed_at: "2026-09-30" }]
    limitations: ["Fusion cannot recover relevant items absent from all input lists."]
    applicability: "Hybrid lexical/dense retrieval where raw scores are not calibrated to a common scale."
    curriculum_usage: { lessons: ["9.4"], labs: ["LAB-C"], assessments: ["Mastery-09"] }
  - id: CLM-006
    claim: "A cross-encoder reranker jointly scores query-document pairs and can improve top-rank relevance, but it can only reorder its candidate pool and adds cost proportional to candidates and sequence shapes."
    provenance: DERIVED
    domain: reranking
    concepts: [cross_encoder, candidate_recall, rerank_cost]
    confidence: high
    currentness_status: "CURRENT DEFAULT / WORKLOAD-DEPENDENT"
    assumptions: ["The reranker does not fetch new documents and independently scores a finite candidate pool."]
    derivation: "Reordering preserves the candidate set; a relevant document outside it cannot enter. Pair-scoring work grows with the number and encoded length of evaluated pairs."
    limitations: ["Batching, truncation, hardware, and model architecture make cost non-linear in practice."]
    applicability: "Second-stage precision improvement after high-recall candidate generation."
    curriculum_usage: { lessons: ["9.5"], labs: ["LAB-C"], assessments: ["Mastery-09"] }
