  - id: CLM-011
    claim: "A number in an observability system is interpretable only with its boundary: a span is one timed operation with causal parent links, an event is a timestamped occurrence attached to (or correlated with) an operation, and a metric is a pre-aggregated series that has lost per-request identity; client-observed time-to-first-chunk, server time-to-first-token, and per-attempt durations measure different intervals of one request, and Development-status attribute names should be emitted with a recorded convention revision and mapped in the pipeline rather than hard-coded into SLO queries."
    provenance: DERIVED
    domain: signal_boundaries
    concepts: [span, event, metric, operation_boundary, convention_stability]
    confidence: high
    currentness_status: "CURRENT DEFAULT (recommended engineering practice)"
    assumptions: ["Clocks of client and server are not synchronized beyond their measured skew.", "The definitions of CLM-004 and CLM-005 hold at the pinned revision."]
    derivation: "Worked example of Lesson 23.1: logical client span 3.650 s; first attempt fails after 0.600 s, retry issued at 0.650 s; first chunk at 1.250 s after the logical start; 121 chunks so (3.650-1.250)/120 = 0.020 s per chunk; server receives the retry at 0.670 s and emits its first token at 1.230 s, so server TTFT = 0.560 s and server TPOT over 241 tokens = (2.960-0.560)/240 = 0.010 s. Client time to first chunk is 1.250 s from the logical start but 0.600 s from the retry attempt; the 1.250-0.560 gap mixes retry, queueing outside the server, network, and client parsing. A histogram bucket (0.64, 1.28] retains none of this decomposition."
    limitations: ["Synthetic timings; the decomposition requires per-attempt child spans or events."]
    applicability: "Every latency or count used in SLIs, alerts, and incident timelines."
    related_claims: [CLM-004, CLM-005]
    curriculum_usage: { lessons: ["23.1"], labs: ["LAB-A"], assessments: ["Mastery-23"] }
