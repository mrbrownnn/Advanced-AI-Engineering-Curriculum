    assumptions:
    - Positive constant warm cost c per second; exponential gaps mean g>0; constant cold penalty P in matching cost
      units.
    - Policy retains warm state for K seconds, then zero; request execution common to both policies excluded.
    - Hard SLO/isolation gates checked separately; sleep residual costs need another state model.
    derivation: C=c*min(G,K)+P*1[G>K]; E[min(G,K)]=integral_0^K exp(-t/g)dt=g*(1-exp(-K/g)). E[C]=cg*(1-exp(-K/g))+P*exp(-K/g);
      derivative=exp(-K/g)*(c-P/g). Synthetic g600s with P44.7c gives P/g0.0745c, immediate-zero cost44.7c versus600c
      always-warm; with miss penalty1800c, P1844.7c gives3.0745c and warm wins. Python-recomputed; no quoted prices
