mechanisms:
  - {"id": "MECH-07", "description": "Adaptation uses candidate-softmax supervision, audited hard negatives, teacher margins and synthetic-query filtering, followed by independent exact retrieval and fixed-pool reranker evaluation.", "evidence_ids": ["CLM-021", "CLM-022", "CLM-023", "CLM-024", "CLM-025", "CLM-026", "CLM-027"], "derived_from": ["MECH-03", "MECH-05", "MECH-06"]}
  - id: "MECH-01"
    description: "A retrieval contract fixes query population, corpus snapshot, document/chunk identity, relevance event and judgments, filters/ACLs, cutoff, latency/capacity boundary, and downstream consumer."
    evidence_ids: ["CLM-008", "CLM-009", "CLM-010"]
    derived_from: []
  - id: "MECH-02"
    description: "Lexical retrieval scores analyzed query terms against indexed terms and corpus statistics; analyzer, fields, BM25 parameters, and snapshot are semantic inputs."
    evidence_ids: ["CLM-001", "CLM-011"]
    derived_from: ["MECH-01"]
  - id: "MECH-03"
    description: "Dense dual encoders map queries and documents to vectors; exact or approximate similarity search generates candidates. Encoder relevance and index approximation are separate error sources."
    evidence_ids: ["CLM-002", "CLM-003", "CLM-004"]
    derived_from: ["MECH-01"]
  - id: "MECH-04"
    description: "Hybrid retrieval unions lexical and dense lists and fuses ranks or calibrated scores; it helps only when branches contribute complementary relevant candidates."
    evidence_ids: ["CLM-005"]
    derived_from: ["MECH-02", "MECH-03"]
  - id: "MECH-05"
    description: "Rerankers and late-interaction models spend more work on a finite candidate set to improve ordering; candidates missing upstream remain unrecoverable. A cross-encoder encodes query and candidate jointly per pair; late interaction encodes them separately into per-token vectors and interacts only through MaxSim, so document vectors can be precomputed."
    evidence_ids: ["CLM-006", "CLM-007", "CLM-016"]
    derived_from: ["MECH-04"]
  - id: "MECH-06"
    description: "Evaluation separates relevance quality, ANN approximation, and stage/end-to-end performance across query slices, filters, corpus snapshots, and load."
    evidence_ids: ["CLM-004", "CLM-008", "CLM-009", "CLM-010", "CLM-012"]
    derived_from: ["MECH-01", "MECH-02", "MECH-03", "MECH-04", "MECH-05"]

mathematical_models:
  - {"id": "MATH-08", "description": "InfoNCE temperature/gradient; shared negatives WB(1+n)-1; independent false-negative probability1-(1-f)^n; teacher-margin MSE and offset-versus-scale invariance. Synthetic arithmetic is not measured quality.", "evidence_ids": ["CLM-028", "CLM-030"], "derived_from": ["MECH-07"]}
  - id: "MATH-01"
    description: "BM25 term contribution uses IDF multiplied by saturated term frequency normalized by document length; k1, b, analyzer, field, corpus statistics, and the IDF convention must be declared. ln((N-n+0.5)/(n+0.5)) is zero at n=N/2 and negative above it, while Lucene's ln(1+(N-n+0.5)/(n+0.5)) is always positive; on the module's four-document fixture the two conventions reverse the ranking."
    evidence_ids: ["CLM-001", "CLM-013"]
    derived_from: ["MECH-02"]
  - id: "MATH-02"
    description: "ANN recall@k = |A_k intersection E_k|/|E_k| under identical vectors, metric, filter, snapshot, and tie policy; this is not relevance recall."
    evidence_ids: ["CLM-004"]
    derived_from: ["MECH-03"]
  - id: "MATH-03"
    description: "RRF score(d)=sum_r w_r/(c+rank_r(d)); the original uses w_r=1 and c=60 over full permutations. Missing-item and duplicate-identity policies plus c, depth, weights, and the score-tie rule are explicit."
    evidence_ids: ["CLM-005"]
    derived_from: ["MECH-04"]
  - id: "MATH-04"
    description: "Recall@k, reciprocal rank, and nDCG@k represent set coverage, first hit, and graded discounted gain respectively; IDCG uses all judged items. Zero-IDCG queries, unjudged documents, and score ties need declared rules because each changes the reported mean; judgment incompleteness remains a limitation."
    evidence_ids: ["CLM-009"]
    derived_from: ["MECH-06"]
  - id: "MATH-05"
    description: "Serial stage latency adds on the critical path; parallel lexical/vector branches join by their maximum plus fusion/shared overhead, while all branch work affects capacity."
    evidence_ids: ["CLM-010"]
    derived_from: ["MECH-06"]
  - id: "MATH-06"
    description: "HNSW layer search state: visited set, candidate frontier C ordered nearest-first, and result list W of size at most ef. Stop when the nearest candidate is farther than the farthest element of W. A neighbor rejected from W is never expanded, which creates local minima; on the module's seven-node graph ANN recall@2 is 0.5 at ef=2 and 1.0 at ef=3."
    evidence_ids: ["CLM-015"]
    derived_from: ["MECH-03", "MATH-02"]
  - id: "MATH-07"
    description: "Late-interaction score S(q,d)=sum over query tokens of max over document tokens of the dot product of L2-normalized token embeddings. It preserves per-token match evidence that single-vector pooling averages away, at the cost of one stored vector per document token."
    evidence_ids: ["CLM-016"]
    derived_from: ["MECH-05"]

implementation_mechanisms:
  - {"id": "IMPL-04", "description": "sentence-transformers main snapshot, not release: candidate concatenation/optional gather/scale; mining masks and opt-in margins; MarginMSELoss target differences. GradCache is not ordinary microbatch accumulation.", "evidence_ids": ["CLM-029", "CLM-030", "CLM-033"], "derived_from": ["MECH-07"]}
  - id: "IMPL-01"
    description: "An index manifest pins corpus, chunker, analyzer or encoder, vector normalization, distance, index build, filter schema, deletion state, and immutable snapshot."
    evidence_ids: ["CLM-001", "CLM-002", "CLM-003"]
    derived_from: ["MECH-02", "MECH-03"]
  - id: "IMPL-02"
    description: "Query traces retain normalized query, branch candidates/raw scores/ranks, fusion, reranker input/output/truncation, filters, timings, cache state, and final IDs."
    evidence_ids: ["CLM-005", "CLM-006", "CLM-010"]
    derived_from: ["MECH-04", "MECH-05", "MECH-06"]
  - id: "IMPL-03"
    description: "Pinned Lucene trace covers BM25Similarity.idf/scorer/doScore (positive IDF, no (k1+1) factor, quantized length), KnnFloatVectorQuery.approximateSearch, HnswGraphSearcher search/searchLevel (filtered-out nodes are traversed but not collected), and AbstractKnnVectorQuery.getLeafResults (exact search for small filters, visit limit, exact fallback). Static inspection only."
    evidence_ids: ["CLM-011", "CLM-013", "CLM-014"]
    derived_from: ["MECH-02", "MECH-03"]

failure_modes:
  - {"id": "FAIL-09", "description": "False negatives receive strong hard-candidate gradients; synthetic query exposure, held-out label tuning and incomplete judgment pools can turn apparent adaptation gains into invalid evidence.", "evidence_ids": ["CLM-024", "CLM-028", "CLM-031", "CLM-032"], "derived_from": ["MECH-07", "MECH-06"]}
  - id: "FAIL-01"
    description: "Analyzer mismatch destroys lexical identity through incompatible tokenization, normalization, fields, or corpus statistics."
    evidence_ids: ["CLM-001", "CLM-011"]
    derived_from: ["MECH-02"]
  - id: "FAIL-02"
    description: "Encoder/index confusion attributes missing relevance to HNSW although exact vector search also misses it, or blames embeddings without measuring approximation against exact ground truth."
    evidence_ids: ["CLM-002", "CLM-003", "CLM-004"]
    derived_from: ["MECH-03", "MATH-02"]
  - id: "FAIL-03"
    description: "Filtered ANN suffers recall/tail transitions, fallback storms, or ACL leakage when filter semantics and search strategy disagree. In the pinned Lucene path a selective filter can convert an approximate query into an exact scan."
    evidence_ids: ["CLM-012", "CLM-014"]
    derived_from: ["MECH-03"]
  - id: "FAIL-04"
    description: "Hybrid fusion adds latency but no recall because branches return redundant candidates or identity normalization fragments duplicates."
    evidence_ids: ["CLM-005"]
    derived_from: ["MECH-04"]
  - id: "FAIL-05"
    description: "Reranker gains saturate or reverse when candidate recall is low, truncation drops evidence, scores shift by domain, or rerank depth saturates capacity."
    evidence_ids: ["CLM-006", "CLM-007", "CLM-008"]
    derived_from: ["MECH-05"]
  - id: "FAIL-06"
    description: "Offline metric improvement fails online because judgments, query mix, unjudged policy, freshness, latency, or user action differ."
    evidence_ids: ["CLM-008", "CLM-009", "CLM-010"]
    derived_from: ["MECH-06"]
  - id: "FAIL-07"
    description: "Convention mismatch: scores or metrics are compared across systems that use different IDF forms, analyzers, RRF constants, or zero-IDCG/unjudged/tie rules, so an apparent quality difference is a definitional artifact."
    evidence_ids: ["CLM-005", "CLM-009", "CLM-013"]
    derived_from: ["MATH-01", "MATH-03", "MATH-04"]
  - id: "FAIL-08"
    description: "Architecture confusion: late interaction is described or budgeted as a cross-encoder (or the reverse), leading to wrong assumptions about precomputation, storage, and per-query cost."
    evidence_ids: ["CLM-006", "CLM-016"]
    derived_from: ["MECH-05", "MATH-07"]

production_connections:
  - {"id": "PROD-03", "description": "Adaptation release pins train/dev/test and generator/teacher lineage, re-encodes the corpus, checks exact relevance, expands judgments and preserves compatible encoder/index rollback.", "evidence_ids": ["CLM-028", "CLM-031", "CLM-032", "CLM-033"], "derived_from": ["IMPL-04", "FAIL-09"]}
  - id: "PROD-01"
    description: "Tune candidate depth, ANN effort, branch fanout, fusion, and reranking jointly on a quality-latency-cost frontier under representative concurrency and filters."
    evidence_ids: ["CLM-004", "CLM-005", "CLM-006", "CLM-010", "CLM-012"]
    derived_from: ["MECH-06"]
  - id: "PROD-02"
    description: "Index releases use immutable snapshots, shadow queries, exact-vector audits, slice metrics, deletion/ACL tests, canary, and rollback."
    evidence_ids: ["CLM-008", "CLM-010", "CLM-011", "CLM-012"]
    derived_from: ["IMPL-01", "IMPL-02", "IMPL-03"]

research_connections:
  - id: "RESEARCH-01"
    description: "BEIR and later benchmarks such as BRIGHT (reasoning-intensive queries) reject universal retriever rankings; current choices remain workload-dependent."
    evidence_ids: ["CLM-008", "CLM-018"]
    derived_from: ["MECH-06"]
  - id: "RESEARCH-02"
    description: "Newer directions include compressed multi-vector retrieval and RL-trained retrieval agents (abstract-level evidence only). Learned sparse retrieval and LLM-based reranking are unverified in this revision and support no required outcome."
    evidence_ids: ["CLM-017", "CLM-019", "CLM-020"]
    derived_from: ["MECH-05"]

todo_verify:
  - id: "TODO-01"
    description: "Open primary sources for learned sparse retrieval and LLM-based reranking/query representations before naming them in the frontier map."
    evidence_ids: ["CLM-020"]
    derived_from: ["RESEARCH-02"]

candidate_capabilities:
  - { capability: "Design and falsify retrieval adaptation without confusing harder negatives with better labels or leaking evaluation supervision.", mapped_mechanisms: ["MECH-07", "MATH-08", "IMPL-04", "FAIL-09", "PROD-03"] }
  - { capability: "Implement and explain lexical, dense, and exact/approximate candidate paths.", mapped_mechanisms: ["MECH-02", "MECH-03", "MATH-01", "MATH-02", "MATH-06", "IMPL-03"] }
  - { capability: "Build hybrid fusion and reranking with inspectable candidate lineage.", mapped_mechanisms: ["MECH-04", "MECH-05", "MATH-03", "MATH-07", "IMPL-02", "FAIL-08"] }
  - { capability: "Evaluate retrieval with relevance, approximation, and system boundaries separated.", mapped_mechanisms: ["MECH-06", "MATH-04", "MATH-05", "PROD-01", "FAIL-07"] }
  - { capability: "Diagnose filtered ANN and offline-to-online regressions.", mapped_mechanisms: ["FAIL-02", "FAIL-03", "FAIL-04", "FAIL-05", "FAIL-06", "PROD-02"] }
