module: "27-rl-post-training-systems"
registry_version: "1.0.0"

required_concepts: [importance_ratio, ppo_clip, three_policy_view, gae, value_baseline, group_baseline, advantage_whitening, loss_aggregation, length_bias, clip_higher, entropy_collapse, entropy_covariance, sequence_level_ratio, rlvr, verifier, verifier_false_negative, verifier_false_positive, spurious_reward, pass_at_k, overoptimization, kl_budget, kl_placement, reward_hacking, audit, rollout_trainer_split, colocation, disaggregation, weight_sync, long_tail_rollout, throughput_accounting, async_rl, staleness, decoupled_ppo, logprob_mismatch, truncated_importance_sampling, effective_sample_size]
prerequisite_concepts: [grpo, grpo_bias, dpo, reward_model, kl_to_base, rlhf, verifier_gaming, pass_at_k_basics, grader_validity, paired_inference, continuous_batching, kv_cache, precision_formats, collectives]
first_occurrence_concepts: [importance_ratio, ppo_clip, three_policy_view, gae, loss_aggregation, clip_higher, entropy_collapse, entropy_covariance, sequence_level_ratio, rlvr, verifier_false_negative, verifier_false_positive, spurious_reward, overoptimization, kl_budget, kl_placement, rollout_trainer_split, colocation, weight_sync, long_tail_rollout, throughput_accounting, staleness, decoupled_ppo, logprob_mismatch, truncated_importance_sampling, effective_sample_size]

