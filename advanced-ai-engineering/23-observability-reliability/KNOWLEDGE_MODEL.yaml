mechanisms:
  - {"id": "MECH-12", "description": "Demand signals drive delayed HPA/KPA recommendations through missing metrics, tolerance and stable/panic policies to useful capacity, not merely desired replicas.", "evidence_ids": ["CLM-045", "CLM-046", "CLM-047", "CLM-048"], "derived_from": ["MECH-01", "MECH-06"]}
  - {"id": "MECH-13", "description": "Phase-conditioned startup evidence selects warm/sleep/zero subject to SLO and sharing isolation; no universal startup bottleneck follows from unlike paper boundaries.", "evidence_ids": ["CLM-049", "CLM-050", "CLM-051", "CLM-052", "CLM-053", "CLM-054", "CLM-055", "CLM-056", "CLM-057", "CLM-058"], "derived_from": ["MECH-12", "MECH-10"]}
  - { id: "MECH-01", description: "Signal contract: define each span, event, and metric by timestamp boundary, population, units, aggregation, failure/cancellation/unfinished treatment, and convention revision; a logical GenAI client span may include retries while child spans/events preserve attempt detail, and client, server, and attempt clocks are not interchangeable.", evidence_ids: ["CLM-004", "CLM-005", "CLM-006", "CLM-010", "CLM-011", "CLM-044"], derived_from: [] }
  - { id: "MECH-02", description: "Pinned semantic contract: the core semantic-conventions repository contains moved/deprecated GenAI definitions at its pin, while the separate semantic-conventions-genai pin carries Development-status GenAI spans, metrics, events, and attributes; production mappings retain a convention revision and treat names as changeable, not stable.", evidence_ids: ["CLM-001", "CLM-002", "CLM-003"], derived_from: ["MECH-01"] }
  - { id: "MECH-03", description: "Trace continuity propagates traceparent across gateway, orchestrator, retrieval, provider, and tool boundaries; sampled is a propagation signal, not proof of completeness, and attempt IDs plus response IDs join logical work to retries and delayed evaluation events.", evidence_ids: ["CLM-004", "CLM-009", "CLM-012", "CLM-013"], derived_from: ["MECH-01"] }
  - { id: "MECH-04", description: "Sampling controls telemetry cost but changes evidence: head sampling can use only creation-time attributes, outcome-aware tail sampling waits for endings and can evict or split late traces, and any rate estimate from unequal inclusion probabilities requires adjusted counts and telemetry-loss counters.", evidence_ids: ["CLM-007", "CLM-013", "CLM-014", "CLM-015", "CLM-016", "CLM-017", "CLM-018", "CLM-042"], derived_from: ["MECH-03"] }
  - { id: "MECH-05", description: "Censoring contract: an ingress ledger records every offered request and a terminal-state ledger distinguishes rejection, success, explicit error, timeout, cancellation, and unfinished-at-window-close; span-derived populations are reconciled against ingress because crashed or dropped spans are not negative labels and are not successes.", evidence_ids: ["CLM-006", "CLM-015", "CLM-019"], derived_from: ["MECH-03", "MECH-04"] }
  - { id: "MECH-06", description: "Offered-outcome SLI: denominator is every eligible offered request/session; numerator is a declared good predicate combining terminal outcome, latency/schema/policy checks, and validated quality when mature; cancellations and unfinished requests are included, excluded by predeclared policy with sensitivity reporting, or bounded, never silently dropped.", evidence_ids: ["CLM-020", "CLM-021", "CLM-044"], derived_from: ["MECH-05"] }
  - { id: "MECH-07", description: "Burn-rate control: bad fraction divided by the SLO error allowance yields burn rate; multiwindow alerts pair long budget-consumption windows with short active-burn windows, and parameters must be checked against maximum possible burn, traffic count, evaluation interval, page value, and reset time rather than copied from a 99.9% example.", evidence_ids: ["CLM-022", "CLM-023", "CLM-024", "CLM-040"], derived_from: ["MECH-06"] }
  - { id: "MECH-08", description: "Proxy-quality control: detector, LLM-judge, and embedding-distance signals are instrument readings, never ground truth. Calibrate against independent adjudication, report sensitivity/specificity or another validation contract with uncertainty and slices, correct population estimates only under explicit invariance assumptions, and refresh when failure mix or rubric changes.", evidence_ids: ["CLM-009", "CLM-025", "CLM-026", "CLM-027", "CLM-028", "CLM-029", "CLM-039", "CLM-041"], derived_from: ["MECH-06"] }
  - { id: "MECH-09", description: "Delayed-label control: recent unlabeled outcomes are right-censored, not negatives; compare mature cohorts or estimate a delay model on mature data and report correction assumptions, while keeping operational fast proxies separate from the later quality SLI.", evidence_ids: ["CLM-030", "CLM-031"], derived_from: ["MECH-05", "MECH-08"] }
  - { id: "MECH-10", description: "Telemetry governance: filter metric labels before aggregation, cap cardinality and observe overflow, keep unbounded IDs out of metrics, capture no prompt/output content by default, minimize/redact/hash where justified, apply separate access/retention to external content, and budget traces and content independently because content hooks may ignore trace sampling.", evidence_ids: ["CLM-008", "CLM-032", "CLM-033", "CLM-034", "CLM-035"], derived_from: ["MECH-02", "MECH-04"] }
  - { id: "MECH-11", description: "Incident loop: SYMPTOM -> competing hypotheses -> missing evidence -> discriminating measurement -> ranked explanation -> intervention -> remeasurement, with immediate safe mitigation and evidence preservation before prolonged diagnosis; a recent change is rolled back only when Module 17 compatibility conditions hold, and detection is never silently promoted to localization.", evidence_ids: ["CLM-036", "CLM-037", "CLM-038", "CLM-040"], derived_from: ["MECH-05", "MECH-07", "MECH-08"] }

mathematical_models:
  - {"id": "MATH-08", "description": "HPA ratio and ceil ready population with inclusive asymmetric tolerance; KPA stable/panic ceil and default6s panic window; T_cap causal decomposition, transient backlog and drain under fixed-rate assumptions.", "evidence_ids": ["CLM-045", "CLM-046", "CLM-048"], "derived_from": ["MECH-12"]}
  - {"id": "MATH-09", "description": "Startup critical path and bandwidth floors; expected keep-alive cost from gap survival; exponential endpoint optimum conditional on constant penalties, with hard SLO gates separate.", "evidence_ids": ["CLM-056", "CLM-058"], "derived_from": ["MECH-13"]}
  - { id: "MATH-01", description: "Signal decomposition: logical client duration covers all attempts; per-output-chunk mean = (last chunk time - first chunk time)/(chunks - 1); server TPOT = (server request duration - server TTFT)/(output tokens - 1). These quantities have different clocks and populations.", evidence_ids: ["CLM-005", "CLM-011"], derived_from: ["MECH-01"] }
  - { id: "MATH-02", description: "Sampling visibility: P(observe >=1 of k rare events) = 1-(1-p)^k under independent probability p; an exported rate under unequal inclusion probabilities is sum(y_i/p_i)/sum(1/p_i), provided p_i is known and telemetry was not additionally censored.", evidence_ids: ["CLM-014", "CLM-018", "CLM-042"], derived_from: ["MECH-04"] }
  - { id: "MATH-03", description: "Offered-outcome SLI = sum good offered outcomes / offered eligible outcomes. Unfinished bounds are [known good / offered, (known good + unfinished) / offered]. Cancellation exclusions require a second sensitivity estimate.", evidence_ids: ["CLM-019", "CLM-020", "CLM-021"], derived_from: ["MECH-05", "MECH-06"] }
  - { id: "MATH-04", description: "For objective S and window T, allowance a=1-S; burn B=e/a; budget fraction consumed over window w is B*w/T; constant-rate exhaustion is T/B; the multiwindow threshold error ratio is B*a; detection time after outage onset is approximately a/e*w*B plus evaluation/notification delay.", evidence_ids: ["CLM-022", "CLM-023", "CLM-037"], derived_from: ["MECH-07"] }
  - { id: "MATH-05", description: "Binary judge correction: with sensitivity q1 and specificity q0, corrected pass rate theta=(p_hat+q0-1)/(q0+q1-1), requiring q0+q1>1 and invariance of P(judge|true label) between calibration and target; interval includes uncertainty from p_hat, q0, and q1.", evidence_ids: ["CLM-025", "CLM-026"], derived_from: ["MECH-08"] }
  - { id: "MATH-06", description: "Delayed positive correction: if F(d) is the mature label-delay CDF and n_d positives have arrived by age d from N outcomes, a stationary-delay estimate is n_d/(N*F(d)); recent unlabeled outcomes remain censored. Detector PPV = pi*sensitivity/[pi*sensitivity+(1-pi)*FPR].", evidence_ids: ["CLM-030", "CLM-031"], derived_from: ["MECH-09"] }
  - { id: "MATH-07", description: "Telemetry scale: metric series upper bound is the product of retained label cardinalities; trace volume = requests x sampled fraction x spans/request x bytes/span; content volume uses its own capture probability because the GenAI content hook may run regardless of sampling. The synthetic mastery fixture supplies the workload and storage inputs used to assess this model.", evidence_ids: ["CLM-008", "CLM-032", "CLM-033", "CLM-035", "CLM-043"], derived_from: ["MECH-10"] }

implementation_mechanisms:
  - {"id": "IMPL-04", "description": "Pinned Kubernetes/Knative upstream calculator and reconciler paths plus vLLM main sleep/wake allocation/doc path, statically inspected only; development endpoints restricted and no live hardware results asserted.", "evidence_ids": ["CLM-045", "CLM-046", "CLM-057"], "derived_from": ["MECH-12", "MECH-13"]}
  - { id: "IMPL-01", description: "Pinned OpenTelemetry GenAI trace: core pin 70550277d98a01ca3fe83bcfc3a2dac18a0d98b7 shows the move/deprecation; active GenAI pin b31e9e8ea26ac1c086d3313d474e31d7c3f391ae defines Development-status inference spans, operation/server/token metrics, evaluation and exception events, content opt-in, finish reasons, and usage attributes; core specification pin 32c0651edf148cfd67054274c5025ebb27773c38 supplies sampling and cardinality semantics.", evidence_ids: ["CLM-001", "CLM-002", "CLM-004", "CLM-005", "CLM-006", "CLM-007", "CLM-008", "CLM-009", "CLM-010", "CLM-013", "CLM-015", "CLM-032", "CLM-044"], derived_from: ["MECH-01", "MECH-02", "MECH-04", "MECH-10"] }
  - { id: "IMPL-02", description: "Collector tail-sampling trace at e43dcb9956a84805be15749055050fb5ea69afd7: createDefaultConfig sets decision_wait 30 s and num_traces 50000; README documents same-collector routing, circular-buffer early drops, late spans, decision cache, maximum trace size, and telemetry for premature drops.", evidence_ids: ["CLM-016"], derived_from: ["MECH-04"] }
  - { id: "IMPL-03", description: "Reliability ledger joins ingress request_id, trace_id, logical operation, attempts, terminal reason, output checks, sample probability, telemetry schema revision, evaluator/rubric version, delayed human label, and deployment version without putting unbounded IDs on metric labels.", evidence_ids: ["CLM-009", "CLM-012", "CLM-019", "CLM-025", "CLM-029", "CLM-033"], derived_from: ["MECH-03", "MECH-05", "MECH-08", "MECH-10"] }

failure_modes:
  - {"id": "FAIL-10", "description": "High duty cycle mistaken for capacity demand; missing loading metrics damp scale-up; graph-capture bottleneck mistaken for fetch delay; MPS/time-slicing mistaken for MIG isolation; time-slicing hides container attribution.", "evidence_ids": ["CLM-045", "CLM-047", "CLM-049", "CLM-050", "CLM-051", "CLM-052", "CLM-053", "CLM-054", "CLM-055"], "derived_from": ["MECH-12", "MECH-13"]}
  - { id: "FAIL-01", description: "Boundary collapse: comparing client time-to-first-chunk with server TTFT or retry attempt duration as though they measure the same interval; aggregated histograms cannot recover the missing decomposition.", evidence_ids: ["CLM-004", "CLM-005", "CLM-011"], derived_from: ["MECH-01"] }
  - { id: "FAIL-02", description: "Schema drift: treating Development-status GenAI names from an unpinned or moved repository as stable, breaking queries or mixing old/deprecated and active definitions.", evidence_ids: ["CLM-001", "CLM-002", "CLM-003"], derived_from: ["MECH-02"] }
  - { id: "FAIL-03", description: "Broken trace continuity: missing or rewritten traceparent across an async queue, provider, retrieval, or tool boundary creates orphan spans and invalid critical-path attribution.", evidence_ids: ["CLM-012", "CLM-013"], derived_from: ["MECH-03"] }
  - { id: "FAIL-04", description: "Rare-failure blindness and biased sampled rates: uniform head sampling misses rare classes, tail sampling overrepresents selected outcomes, collector eviction drops long traces, and late spans can be split across decisions.", evidence_ids: ["CLM-014", "CLM-016", "CLM-017", "CLM-018", "CLM-042"], derived_from: ["MECH-04"] }
  - { id: "FAIL-05", description: "Censored reliability: successful ended/exported spans form the denominator while crashes, exporter loss, rejections, cancellations, and unfinished requests disappear, making reliability look better as the system fails.", evidence_ids: ["CLM-006", "CLM-015", "CLM-019", "CLM-021"], derived_from: ["MECH-05", "MECH-06"] }
  - { id: "FAIL-06", description: "Burn-alert cargo cult: copying 14.4/6/1 without rescaling the SLO or checking maximum burn, paging from one low-traffic failure, or using only a fast burn so sustained lower burn exhausts the budget silently.", evidence_ids: ["CLM-022", "CLM-023", "CLM-024"], derived_from: ["MECH-07"] }
  - { id: "FAIL-07", description: "Proxy-as-truth: treating detector output, LLM-judge score, or embedding distance as the true outcome; stale calibration, base-rate changes, failure-mix shifts, criteria drift, and delayed labels can reverse or inflate the quality conclusion.", evidence_ids: ["CLM-025", "CLM-026", "CLM-028", "CLM-029", "CLM-030", "CLM-031", "CLM-039", "CLM-041"], derived_from: ["MECH-08", "MECH-09"] }
  - { id: "FAIL-08", description: "Telemetry becomes the incident: combinatorial metric labels trigger overflow or backend cost, prompt/output content bypasses trace sampling, and sensitive data reaches broad observability access and retention.", evidence_ids: ["CLM-008", "CLM-032", "CLM-033", "CLM-034", "CLM-035"], derived_from: ["MECH-10"] }
  - { id: "FAIL-09", description: "Detection-localization fallacy: terminal status or a broad alert reliably detects failure but lacks decision/provenance evidence to identify origin; diagnosis-first delays safe mitigation and burns extra budget.", evidence_ids: ["CLM-036", "CLM-037", "CLM-038"], derived_from: ["MECH-11"] }

production_connections:
  - {"id": "PROD-05", "description": "Join control decisions and phase/cache-state timelines to offered outcomes, symbolic Module22 idle/miss costs and sharing fault/telemetry boundaries; price and recovery ownership remain outside Module23.", "evidence_ids": ["CLM-048", "CLM-053", "CLM-054", "CLM-055", "CLM-056", "CLM-057", "CLM-058"], "derived_from": ["IMPL-04", "FAIL-10"]}
  - { id: "PROD-01", description: "Reliability dashboard separates offered, admitted, completed, and useful-good populations; shows unfinished age, rejection/cancellation reasons, trace completeness, export drops, sample policy/revision, and quality-label maturity beside SLO burn.", evidence_ids: ["CLM-015", "CLM-019", "CLM-021", "CLM-030"], derived_from: ["MECH-05", "MECH-06", "MECH-09"] }
  - { id: "PROD-02", description: "Page policy uses at least two burn tiers with paired long/short windows, minimum event counts or Bayesian/interval treatment for low traffic, synthetics reported separately from real-user SLIs, and a ticket path for sustained lower burn.", evidence_ids: ["CLM-022", "CLM-023", "CLM-024"], derived_from: ["MECH-07"] }
  - { id: "PROD-03", description: "Quality monitoring joins fast proxy events to delayed independent labels by response ID and cohort age; the operational page is explicitly a proxy page, while SLO accounting uses mature/corrected labels and calibrated uncertainty.", evidence_ids: ["CLM-009", "CLM-025", "CLM-027", "CLM-030", "CLM-031"], derived_from: ["MECH-08", "MECH-09"] }
  - { id: "PROD-04", description: "Runbook starts with safe mitigation (rollback, traffic shift, feature disable, degradation) and evidence preservation, then executes discriminating queries over request, attempt, deployment, provider, label-maturity, and telemetry-completeness dimensions before prevention and remeasurement.", evidence_ids: ["CLM-036", "CLM-037", "CLM-038", "CLM-040"], derived_from: ["MECH-11"] }

research_connections:
  - { id: "RESEARCH-01", description: "Dapper supplies the tracing/sampling baseline; OpenTelemetry's evolving probability-sampling specification and beta tail sampler provide current mechanisms whose unbiasedness and failure behavior require validation under LLM trace length and outcome skew.", evidence_ids: ["CLM-013", "CLM-014", "CLM-016", "CLM-017"], derived_from: ["MECH-04"] }
  - { id: "RESEARCH-02", description: "Judge correction, prediction-powered inference, judge vulnerability studies, criteria drift, shift detection, and delayed-feedback models provide bounded tools for quality monitoring; none turns a proxy into ground truth.", evidence_ids: ["CLM-025", "CLM-027", "CLM-028", "CLM-029", "CLM-030", "CLM-039"], derived_from: ["MECH-08", "MECH-09"] }
  - { id: "RESEARCH-03", description: "TelemetrySuffBench's detection-localization gap is a frontier warning that standard traces can flag failure yet omit causal decision/provenance links; its result is synthetic and abstract-level, so the module tests sufficiency with controlled faults rather than adopting its numbers as a production expectation.", evidence_ids: ["CLM-038"], derived_from: ["MECH-11"] }

candidate_capabilities:
  - { capability: "Defend delayed autoscaling, phase-specific startup intervention and warm/sleep/zero choice under SLO and GPU-isolation constraints.", mapped_mechanisms: ["MECH-12", "MECH-13", "MATH-08", "MATH-09", "IMPL-04", "FAIL-10", "PROD-05"] }
  - { capability: "Define and implement trace, event, and metric boundaries and trace the pinned Development-status OpenTelemetry GenAI convention without presenting it as stable.", mapped_mechanisms: ["MECH-01", "MECH-02", "MATH-01", "IMPL-01", "FAIL-01", "FAIL-02"] }
  - { capability: "Propagate context and quantify sampling, retry, cancellation, unfinished-request, and telemetry-loss bias.", mapped_mechanisms: ["MECH-03", "MECH-04", "MECH-05", "MATH-02", "IMPL-02", "IMPL-03", "FAIL-03", "FAIL-04", "FAIL-05"] }
  - { capability: "Define offered-outcome SLIs and error-budget/burn-rate alerts with correct denominators, low-traffic handling, and recomputed thresholds.", mapped_mechanisms: ["MECH-06", "MECH-07", "MATH-03", "MATH-04", "FAIL-06", "PROD-01", "PROD-02"] }
  - { capability: "Use detector, judge, embedding, and delayed-label signals as calibrated measurement instruments rather than ground truth.", mapped_mechanisms: ["MECH-08", "MECH-09", "MATH-05", "MATH-06", "FAIL-07", "PROD-03"] }
  - { capability: "Budget and govern telemetry cardinality, content volume, and privacy.", mapped_mechanisms: ["MECH-10", "MATH-07", "FAIL-08"] }
  - { capability: "Discriminate incidents, mitigate safely before prolonged diagnosis, verify rollback, and remeasure with telemetry-completeness checks.", mapped_mechanisms: ["MECH-11", "FAIL-09", "PROD-04"] }
