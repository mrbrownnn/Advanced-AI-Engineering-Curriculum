first_occurrence_concepts: [autoscaling_control, hpa, kpa, scaling_signal, time_to_capacity, cold_start_phases, keep_alive, scale_to_zero, sleep_mode, gpu_isolation, signal_boundary, semantic_conventions, convention_stability, context_propagation, traceparent, head_sampling, tail_sampling, adjusted_count, censoring, telemetry_loss, offered_outcome_sli, error_budget, burn_rate, multiwindow_alert, low_traffic_alerting, detector_precision, delayed_labels, invariance_assumption, cardinality, content_capture, telemetry_volume, incident_discrimination, mitigation_first]

